spring:
  datasource:
    # 테스트는 컨텍스트마다 새 임시 파일 DB를 운영과 같은 WAL 모드로 쓴다.
    # 공유 캐시 메모리 DB는 테이블 단위로 잠겨, 백그라운드 작업(인증서 발급)과 읽기가 겹치면 바로 실패한다
    url: jdbc:sqlite:${java.io.tmpdir}/nm-test-${random.uuid}.db?journal_mode=WAL&foreign_keys=on&busy_timeout=5000
    hikari:
      minimum-idle: 1
  jpa:
    properties:
      hibernate:
        generate_statistics: true

nginx:
  runtime:
    config-root: ${java.io.tmpdir}/nm-test-no-config-root
    health-timeout: 200ms
    binary: /nonexistent/nginx
    pid-file: ${java.io.tmpdir}/nginx-manager-test-missing.pid
    status-url: http://127.0.0.1:1/nginx_status
    command-timeout: 2s

nginx-manager:
  acme:
    webroot: ${java.io.tmpdir}/nm-test-acme-webroot
    account-dir: ${java.io.tmpdir}/nm-test-acme-accounts
  cert:
    # 테스트에서는 예약 갱신을 돌리지 않는다. 필요한 테스트가 직접 부른다
    initial-delay: PT24H
  process-watch:
    interval: PT24H

logging:
  level:
    org.hibernate.engine.internal.StatisticalLoggingSessionEventListener: warn
