sites.proxy.readTimeout=응답 타임아웃(초, 비우면 60)
sites.proxy.readTimeout.note=웹소켓이나 오래 걸리는 요청은 응답 타임아웃을 길게(예: 3600) 잡으세요. 이 시간 동안 백엔드가 아무것도 보내지 않으면 연결을 끊습니다.
sites.proxy.loadBalancing=백엔드가 여럿일 때 나누는 방식
sites.proxy.loadBalancing.hint=프록시 대상이 둘 이상일 때만 쓰입니다. 로그인 세션을 서버 메모리에 두는 앱이면 같은 IP를 같은 백엔드로 보내는 방식을 고르세요.
enum.LoadBalancing.ROUND_ROBIN=차례대로 (기본)
enum.LoadBalancing.LEAST_CONN=연결이 가장 적은 백엔드로
enum.LoadBalancing.IP_HASH=같은 클라이언트 IP는 같은 백엔드로
sites.detail.viewLogs=로그 보기
sites.detail.saved.before=초안을 저장했습니다.
sites.detail.saved.link=적용 화면
sites.detail.saved.after=에서 반영하세요.
sites.detail.rawOnly=원문 편집기로 고친 사이트라 폼 값으로 저장하지 않았습니다. 설정 파일 화면에서 고치거나, 원문 초안을 버리면 다시 폼으로 고칠 수 있습니다.
sites.detail.settings=설정
sites.detail.extraDomains=추가 도메인
sites.detail.staticRoot=문서 루트
sites.detail.https.title=HTTPS 인증서
sites.detail.https.active=발급됨
sites.detail.https.pending=발급 대기
sites.detail.https.failing=실패
sites.detail.https.expires=만료 {0}
sites.detail.https.none=HTTPS를 쓰지 않습니다.
sites.detail.https.enable=Let's Encrypt 인증서 발급받기
sites.detail.https.enableNote=인증서를 받으면 HTTPS 설정을 자동으로 적용하고, 만료 전에 갱신합니다. 도메인이 이 서버를 가리키고 인터넷에서 80 포트로 들어올 수 있어야 합니다.
sites.detail.raw.title=원문 편집 사이트
sites.detail.raw.body=이 사이트는 원문으로만 관리합니다. 폼이 설정을 다시 덮어쓰지 않습니다.
sites.detail.editRaw=원문 편집
sites.detail.disable=비활성화
sites.detail.enable=활성화
logs.view.pageTitle={0} 로그
logs.view.titleBefore=
logs.view.titleAfter=로그
logs.view.search=찾을 말
logs.view.search.placeholder=예: 502, /api, upstream
logs.view.search.submit=검색
logs.view.search.hint=입력한 글자가 들어간 줄만 보여 줍니다. 상태 코드(502)나 경로(/api)로 찾아 보세요. 실시간 보기는 새로 쌓이는 줄을 바로 보여 줍니다.
logs.view.missing=로그 파일이 아직 없습니다. 이 사이트로 요청이 들어오면 생깁니다.
logs.view.lineCount={0}줄
logs.view.limited=(최근 {0}줄까지)
logs.view.exhausted=· 파일 끝부분만 찾았습니다
logs.view.newestFirst=· 최근 줄이 위에 있습니다
logs.view.live.title=실시간
logs.view.live.start=실시간 보기
logs.view.live.stop=실시간 멈추기
logs.view.live.stopped=멈춤
logs.view.live.connecting=연결 중
logs.view.live.watching=보는 중
logs.view.live.reconnecting=다시 연결 중

dashboard.modules.unknown=설명이 등록되지 않은 모듈입니다. nginx 문서에서 이름으로 찾아보세요.
module.desc.compat=다른 곳에서 빌드한 동적 모듈도 이 nginx에 불러올 수 있게 바이너리 호환성을 맞춥니다.
module.desc.file-aio=디스크 파일을 비동기 입출력으로 읽습니다. 큰 파일을 보낼 때 aio 지시어로 켭니다.
module.desc.threads=스레드 풀을 씁니다. 느린 디스크 읽기를 별도 스레드로 넘겨 요청 처리가 막히지 않게 합니다(aio threads).
module.desc.pcre-jit=location과 rewrite의 정규식을 JIT로 컴파일해 더 빠르게 맞춥니다.
module.desc.debug=자세한 디버그 로그를 남길 수 있습니다. error_log를 debug 수준으로 두면 켜집니다.
module.desc.http_addition_module=응답 본문 앞뒤에 다른 요청의 결과를 덧붙입니다(add_before_body, add_after_body).
module.desc.http_auth_request_module=요청마다 별도 인증 서버에 물어보고, 허용될 때만 통과시킵니다(auth_request).
module.desc.http_dav_module=WebDAV의 PUT, DELETE, MKCOL, COPY, MOVE로 파일을 올리고 지울 수 있게 합니다(dav_methods).
module.desc.http_degradation_module=메모리가 부족할 때 일부 요청에 오류를 돌려줘 서버가 버티게 합니다.
module.desc.http_flv_module=FLV 동영상을 원하는 위치부터 재생할 수 있게 보냅니다(flv).
module.desc.http_gunzip_module=gzip을 지원하지 않는 클라이언트에는 압축된 응답을 풀어서 보냅니다(gunzip).
module.desc.http_gzip_static_module=미리 압축해 둔 .gz 파일이 있으면 그대로 보냅니다(gzip_static).
module.desc.http_mp4_module=MP4 동영상을 원하는 위치부터 재생할 수 있게 보냅니다(mp4).
module.desc.http_random_index_module=디렉터리 요청에 그 안의 파일 하나를 무작위로 골라 보냅니다(random_index).
module.desc.http_realip_module=프록시나 로드 밸런서 뒤에 있을 때 X-Forwarded-For 같은 헤더에서 실제 클라이언트 IP를 가져옵니다(set_real_ip_from).
module.desc.http_secure_link_module=서명과 만료 시각이 들어 있는 링크로만 파일에 접근하게 합니다(secure_link).
module.desc.http_slice_module=큰 파일을 조각으로 나눠 받아 캐시합니다. 대용량 파일 프록시 캐시에 씁니다(slice).
module.desc.http_ssl_module=HTTPS를 제공합니다. 인증서를 붙인 사이트는 이 모듈로 동작합니다(listen ... ssl).
module.desc.http_stub_status_module=현재 연결 수와 처리한 요청 수 같은 기본 상태 정보를 보여 줍니다(stub_status).
module.desc.http_sub_module=응답 본문의 문자열을 다른 문자열로 바꿔서 보냅니다(sub_filter).
module.desc.http_v2_module=HTTP/2를 지원합니다. 한 연결로 여러 요청을 동시에 주고받습니다(http2 on).
module.desc.http_v3_module=QUIC 위에서 동작하는 HTTP/3를 지원합니다(listen ... quic).
module.desc.google_perftools_module=Google perftools로 워커 프로세스의 CPU 사용을 프로파일링합니다(google_perftools_profiles).
module.desc.mail=IMAP, POP3, SMTP 메일 프록시를 씁니다(mail 블록).
module.desc.mail_ssl_module=메일 프록시에서 SSL/TLS와 STARTTLS를 씁니다.
module.desc.stream=TCP와 UDP 연결을 그대로 전달하는 스트림 프록시입니다. 데이터베이스나 메일 서버 같은 HTTP가 아닌 서비스를 프록시할 때 씁니다. 스트림 화면에서 만듭니다(stream 블록).
module.desc.stream_realip_module=스트림 프록시에서 PROXY 프로토콜로 받은 실제 클라이언트 주소를 씁니다(set_real_ip_from).
module.desc.stream_ssl_module=스트림 프록시에서 TLS 연결을 받거나 TLS로 백엔드에 연결합니다.
module.desc.stream_ssl_preread_module=TLS를 풀지 않고 접속하려는 도메인(SNI)을 읽어 연결을 나눠 보냅니다(ssl_preread).
module.desc.http_xslt_module=XML 응답을 XSLT 스타일시트로 변환합니다(xslt_stylesheet).
module.desc.http_image_filter_module=JPEG, GIF, PNG, WebP 이미지를 그때그때 줄이거나 자르거나 돌립니다(image_filter).
module.desc.http_geoip_module=GeoIP 데이터베이스로 클라이언트 IP의 국가와 도시를 알아내 변수로 씁니다(geoip_country).
module.desc.stream_geoip_module=스트림 프록시에서 GeoIP로 클라이언트의 국가와 도시를 알아냅니다(geoip_country).
module.desc.http_perl_module=Perl로 작성한 처리기와 변수를 설정 안에서 씁니다(perl, perl_set).
module.desc.njs=JavaScript로 요청 처리와 변수를 작성합니다. HTTP와 스트림 양쪽에서 씁니다(js_import, js_content).
sites.field.type.REDIRECT=리디렉션
sites.list.type.REDIRECT=리디렉션
sites.redirect.target=보낼 주소
sites.redirect.target.hint=요청을 넘길 주소입니다. 예: https://new.example.com. nginx의 return 지시어로 만듭니다.
sites.redirect.code=응답 코드
sites.redirect.code.301=301 영구 이동 (검색엔진이 새 주소로 바꿈)
sites.redirect.code.302=302 임시 이동
sites.redirect.code.307=307 임시 이동 (POST 등 메서드 유지)
sites.redirect.code.308=308 영구 이동 (POST 등 메서드 유지)
sites.redirect.keepPath=요청 경로와 쿼리를 그대로 붙이기
sites.redirect.keepPath.hint=켜면 /a?b=1 요청을 보낼 주소/a?b=1로 넘깁니다. 끄면 모든 요청을 보낼 주소 하나로 넘깁니다.
sites.opt.access.title=접근 제한 (IP, 비밀번호)
sites.opt.access.intro=사내 도구나 스테이징 사이트를 보호합니다. Let's Encrypt 인증서 발급 경로는 제한하지 않습니다.
sites.opt.allowFrom=허용할 주소 (비우면 모두 허용)
sites.opt.allowFrom.hint=IP나 CIDR을 줄마다 적습니다. 예: 10.0.0.0/8. 하나라도 적으면 목록에 없는 주소는 403으로 막습니다(allow, deny all).
sites.opt.denyFrom=차단할 주소
sites.opt.denyFrom.hint=이 주소에서 오는 요청은 403으로 막습니다(deny). 허용 목록보다 먼저 검사합니다.
sites.opt.authUsers=비밀번호 보호 사용자
sites.opt.authUsers.hint=줄마다 "이름:비밀번호"로 사용자를 더하거나 비밀번호를 바꿉니다. 이름만 적으면 저장된 비밀번호를 그대로 둡니다. 줄을 지우면 그 사용자를 지웁니다. 비밀번호는 8자 이상이고 해시로만 저장됩니다(auth_basic).
sites.opt.satisfyAny=허용 주소이거나 비밀번호가 맞으면 통과
sites.opt.satisfyAny.hint=IP 제한과 비밀번호를 함께 쓸 때만 의미가 있습니다. 켜면 사내망은 비밀번호 없이, 밖에서는 비밀번호로 들어옵니다. 끄면 둘 다 맞아야 합니다(satisfy).
sites.opt.limit.title=요청 속도·동시 연결 제한
sites.opt.limit.intro=한 클라이언트가 너무 많은 요청을 보내 서버를 막지 않게 합니다. 넘는 요청은 429(Too Many Requests)로 거절합니다. 비우면 제한하지 않습니다.
sites.opt.rateLimit=클라이언트 IP당 초당 요청 수
sites.opt.rateLimit.hint=예: 10. 페이지 하나가 이미지·스크립트로 요청을 여러 개 보내므로 넉넉히 잡고 버스트를 함께 정하세요(limit_req).
sites.opt.rateBurst=버스트 (순간적으로 더 받을 요청 수)
sites.opt.rateBurst.hint=예: 20. 이만큼은 한꺼번에 와도 바로 처리하고, 그 뒤부터 초당 요청 수로 제한합니다.
sites.opt.connLimit=클라이언트 IP당 동시 연결 수
sites.opt.connLimit.hint=예: 20. 큰 파일 다운로드를 여러 개 동시에 받는 것 같은 사용을 제한합니다(limit_conn).
sites.opt.perf.title=성능·보안 (압축, 헤더, HTTP/3, 요청 크기, 실제 IP, 캐시)
sites.opt.gzip=응답 압축 (gzip)
sites.opt.gzip.hint=HTML, CSS, JavaScript, JSON 같은 텍스트 응답을 압축해 전송량을 줄입니다. 정적 사이트는 미리 만든 .gz 파일이 있으면 그것을 보냅니다(gzip, gzip_static).
sites.opt.securityHeaders=보안 헤더 넣기
sites.opt.securityHeaders.hint=X-Content-Type-Options: nosniff, X-Frame-Options: SAMEORIGIN, Referrer-Policy를 붙여 흔한 브라우저 공격을 막습니다. 백엔드가 같은 헤더를 이미 보내면 중복될 수 있습니다(add_header).
sites.opt.hsts=HSTS (브라우저가 늘 HTTPS로 접속)
sites.opt.hsts.hint=HTTPS 사이트에서만 쓸 수 있습니다. 브라우저가 1년 동안 이 도메인을 HTTPS로만 엽니다. 켠 뒤에는 HTTPS를 끄기 어려우니 HTTPS가 안정적으로 동작할 때 켜세요(Strict-Transport-Security).
sites.opt.http3=HTTP/3 (QUIC)
sites.opt.http3.hint=HTTPS 사이트에서만 쓸 수 있습니다. UDP 443 포트로 HTTP/3를 받아 모바일처럼 불안정한 회선에서 더 빠르게 연결합니다. nginx 컨테이너의 443/udp 포트가 열려 있어야 합니다(listen 443 quic, Alt-Svc).
sites.opt.http3.notReady=지금 nginx.conf에는 HTTP/3용 443 기본 서버(listen 443 quic reuseport)가 없습니다. 이 옵션을 켜기 전에 기본 설정의 443 기본 서버 블록을 nginx.conf에 더하세요(README 참고).
sites.opt.maxBodySize=최대 요청 크기(MB, 비우면 1)
sites.opt.maxBodySize.hint=파일 업로드처럼 큰 요청을 받을 때 늘립니다. 넘으면 413 오류를 돌려줍니다. 0이면 제한하지 않습니다(client_max_body_size).
sites.opt.realIpFrom=믿을 프록시 주소 (실제 클라이언트 IP)
sites.opt.realIpFrom.hint=이 nginx 앞에 로드 밸런서나 CDN이 있으면 그 주소를 적습니다. 그 주소에서 온 요청은 아래 헤더의 IP를 실제 클라이언트 IP로 보고 로그, IP 제한, 속도 제한에 씁니다(set_real_ip_from).
sites.opt.realIpHeader=실제 IP가 담긴 헤더
sites.opt.cacheMinutes=프록시 캐시 유지 시간(분, 리버스 프록시)
sites.opt.cacheMinutes.hint=비우면 캐시하지 않습니다. 정하면 백엔드의 성공 응답(200, 301, 302)을 이 시간 동안 저장해 두고 바로 돌려줍니다. 백엔드가 Cache-Control: no-store나 Set-Cookie를 보낸 응답은 캐시하지 않습니다. 적중 여부는 X-Cache-Status 헤더로 확인합니다(proxy_cache).
sites.opt.autoindex=디렉터리 목록 보이기 (정적 파일)
sites.opt.autoindex.hint=index.html이 없는 폴더를 열면 파일 목록을 보여 줍니다. 공개해도 되는 파일만 있는 폴더에서만 켜세요(autoindex).
msg.validation.maxBodySize=최대 요청 크기는 0~10240MB입니다.
msg.validation.rateLimit=초당 요청 수는 1~100000입니다.
msg.validation.rateBurst=버스트는 0~100000입니다.
msg.validation.connLimit=동시 연결 수는 1~100000입니다.
msg.validation.cacheMinutes=캐시 유지 시간은 1~525600분입니다.
msg.validation.addresses=IP 주소나 CIDR(예: 10.0.0.0/8)만 적을 수 있습니다. 공백·쉼표·줄바꿈으로 구분하고 200개까지 적습니다.
msg.validation.authUsers=사용자 이름은 영문, 숫자, . _ @ - 로 64자까지, 비밀번호는 8~128자입니다. 줄마다 이름:비밀번호 또는 이름만 적습니다(100명까지).
msg.validation.redirectTarget=보낼 주소는 http:// 나 https:// 로 시작해야 하고 공백, 따옴표, $, ;, # 은 쓸 수 없습니다.
msg.validation.redirectCode=응답 코드는 301, 302, 307, 308 중 하나입니다.
msg.validation.redirectKeepPath=쿼리(?)가 있는 주소에는 요청 경로를 붙일 수 없습니다. 경로 유지를 끄거나 쿼리를 빼 주세요.
msg.validation.httpsOnlyOption=HSTS와 HTTP/3는 HTTPS를 켠 사이트에서만 쓸 수 있습니다.
msg.site.authPasswordRequired=새 사용자 {0}에는 비밀번호가 필요합니다. 이름:비밀번호로 적어 주세요.
files.list.new=새 파일
files.list.deleted=아직 적용하지 않은 새 파일 초안을 지웠습니다.
files.new.title=새 설정 파일
files.new.help=폼이 없는 모듈(njs 스크립트, mail·stream 설정, Perl 모듈, XSLT 스타일시트 등)을 쓸 때 설정 루트(/etc/nginx) 아래에 파일을 만듭니다. 만든 파일은 초안이며, 적용 화면에서 nginx -t로 검증한 뒤 반영됩니다. nginx가 읽게 하려면 그 파일을 include하거나 불러오는 설정이 있어야 합니다.
files.new.path=경로 (/etc/nginx 기준)
files.new.path.hint=예: stream.d/mqtt.conf, njs/auth.js. 영문, 숫자, . _ - 와 / 만 쓸 수 있고, certs/와 htpasswd/에는 만들 수 없습니다.
files.new.content=내용
files.new.submit=초안으로 만들기
files.new.error.path=쓸 수 없는 경로입니다. 영문, 숫자, . _ - 와 / 만 쓰고, .. 이나 .으로 시작하는 이름, certs/와 htpasswd/ 아래는 쓸 수 없습니다.
files.new.error.exists=이미 있는 파일입니다. 설정 파일 목록에서 열어 고치세요.
files.new.where.stream=nginx.conf의 stream 블록이 읽습니다. 스트림 화면으로 만들 수 없는 설정(SNI로 나누기 등)을 둡니다.
files.new.where.sites=http 블록이 읽습니다. 여기 만든 파일은 적용하면 원문 편집 사이트로 사이트 목록에 나타납니다.
files.new.where.njs=njs 스크립트. nginx.conf나 사이트 설정에서 js_import njs/파일.js; 로 불러옵니다.
files.new.where.main=mail 블록 같은 최상위 설정은 nginx.conf에 include 줄을 더해 불러옵니다.
files.edit.delete=이 파일 지우기 (초안)
files.edit.delete.hint=지우는 초안을 만듭니다. 적용해야 서버에서 지워지고, 그 전에는 적용 화면에서 초안을 버려 되살릴 수 있습니다. 사이트 파일은 사이트 화면의 비활성화로 다룹니다.
files.edit.deleted.before=이 파일을 지우는 초안이 있습니다.
files.edit.deleted.after=에서 반영하거나 초안을 버리세요.
nav.streams=스트림
streams.list.title=스트림 (TCP/UDP 프록시)
streams.list.add=스트림 추가
streams.list.help=데이터베이스, MQTT, 게임 서버처럼 HTTP가 아닌 서비스를 nginx 뒤에 둡니다. 받은 TCP/UDP 연결을 내용을 보지 않고 그대로 백엔드로 넘깁니다(stream 모듈). 설정은 stream.d/ 아래 파일 하나로 만들어지고, 사이트처럼 적용 화면에서 검증 후 반영됩니다.
streams.list.empty=등록된 스트림이 없습니다.
streams.list.col.listen=받는 포트
streams.list.col.backends=백엔드
streams.list.col.note=메모
streams.list.deleted.before=스트림을 지우는 초안을 만들었습니다.
streams.badge.raw=원문 편집
streams.form.title=스트림 추가
streams.form.portNote=밖에서 접속하려면 nginx 컨테이너에서 이 포트를 열어야 합니다. docker-compose.yml의 nginx 서비스 ports에 "포트:포트"(UDP는 "포트:포트/udp")를 더하고 다시 띄우세요.
streams.field.protocol=프로토콜
streams.field.protocol.hint=데이터베이스, MQTT, SSH, Redis처럼 연결을 유지하는 서비스는 TCP, DNS, syslog, 게임 서버 일부는 UDP입니다.
streams.field.listenPort=받을 포트
streams.field.listenPort.hint=nginx가 연결을 받을 포트입니다. 프로토콜과 포트가 설정 파일 이름(stream.d/tcp-5432.conf)이 되며 저장한 뒤에는 바꿀 수 없습니다. 80, 443, 7070, 8081, 9000과 사이트가 쓰는 포트는 쓸 수 없습니다.
streams.field.backends=백엔드 (호스트:포트, 여러 개면 줄마다 하나)
streams.field.backends.hint=연결을 넘길 서버입니다. 예: 10.0.0.5:5432, db:5432. 호스트 이름은 nginx가 설정을 읽을 때 한 번 찾으므로 그때 찾을 수 있어야 합니다.
streams.field.loadBalancing=백엔드가 여럿일 때 나누는 방식
streams.field.loadBalancing.hint=백엔드가 둘 이상일 때만 쓰입니다. 연결이 끊기면 상태가 사라지는 서비스(게임, 세션을 기억하는 서버)는 같은 IP를 같은 백엔드로 보내세요.
streams.field.connectTimeout=연결 타임아웃(초, 비우면 60)
streams.field.connectTimeout.hint=백엔드와 연결을 맺을 때까지 기다리는 시간입니다. 넘으면 다음 백엔드를 시도합니다(proxy_connect_timeout).
streams.field.idleTimeout=유휴 타임아웃(초, 비우면 600)
streams.field.idleTimeout.hint=양쪽 모두 이 시간 동안 아무것도 보내지 않으면 연결을 끊습니다. 오래 유지되는 DB·MQTT 연결은 길게 잡으세요(proxy_timeout).
streams.field.note=메모
streams.field.note.hint=무엇을 위한 스트림인지 적어 둡니다. 설정 파일 맨 위 주석으로도 들어갑니다.
streams.detail.fixedPort=프로토콜과 포트는 바꿀 수 없습니다. 바꾸려면 이 스트림을 지우고 새로 만드세요.
streams.detail.raw.body=이 스트림 파일은 원문 편집기에서 고쳤거나 직접 만든 파일이라 원문으로만 관리합니다. 폼이 설정을 다시 덮어쓰지 않습니다.
streams.detail.ports=밖에서 접속하려면 docker-compose.yml의 nginx 서비스 ports에 "{0}:{0}{1}"을 더해야 합니다.
streams.detail.delete=스트림 지우기 (초안)
enum.StreamBalancing.ROUND_ROBIN=차례대로 (기본)
enum.StreamBalancing.LEAST_CONN=연결이 가장 적은 백엔드로
enum.StreamBalancing.IP_HASH=같은 클라이언트 IP는 같은 백엔드로
msg.validation.streamPort=포트는 1~65535입니다.
msg.validation.streamIdleTimeout=유휴 타임아웃은 1~86400초입니다.
msg.validation.streamBackends=백엔드는 호스트:포트 형식으로 1~32개 적어 주세요. 예: 10.0.0.5:5432
msg.validation.streamReservedPort=이 포트는 HTTP(80, 443)나 관리도구(7070, 8081, 9000)가 씁니다. UDP는 443(HTTP/3)만 쓸 수 없습니다.
msg.stream.portTaken={0}번 포트는 이미 {1}에서 씁니다.

# HTTPS 선택(사용 안 함 / Let's Encrypt / 업로드)과 등록 후 발급
sites.https.intro=HTTPS를 쓸지, 쓴다면 인증서를 어떻게 마련할지 고릅니다. 지금은 '사용 안 함'으로 두고, 사이트를 만든 뒤 사이트 화면이나 인증서 화면에서 Let's Encrypt 인증서를 받아도 됩니다.
sites.https.mode.NONE=사용 안 함 (HTTP만)
sites.https.mode.NONE.hint=HTTP로만 응답합니다. 도메인을 아직 이 서버로 연결하지 않았거나 테스트용 사이트일 때 고르세요.
sites.https.mode.LETS_ENCRYPT=Let's Encrypt 인증서 발급 (무료, 자동 갱신)
sites.https.mode.LETS_ENCRYPT.hint=적용하면 인증서를 받아 HTTPS 설정을 자동으로 더하고, 만료 전에 갱신합니다. 대표·추가 도메인이 모두 이 서버를 가리키고 인터넷에서 80 포트로 들어올 수 있어야 합니다. 받기 전까지는 HTTP로만 응답합니다. 와일드카드 도메인(*.example.com)은 받을 수 없습니다.
sites.https.mode.UPLOADED=업로드한 인증서 사용
sites.https.mode.UPLOADED.hint=와일드카드 인증서나 사내 CA 인증서처럼 직접 받아 인증서 화면에 올린 인증서를 씁니다. 자동으로 갱신되지 않습니다.
sites.https.mode.UPLOADED.none=아직 올린 인증서가 없습니다.
sites.https.mode.UPLOADED.link=인증서 화면에서 올리기
sites.https.chooseCertificate=인증서를 고르세요
msg.validation.certificateRequired=사용할 업로드 인증서를 고르세요.
sites.detail.https.enableNoteNotLive=이 사이트는 아직 nginx에 반영되지 않았거나 꺼져 있습니다. 지금 눌러 두면 사이트를 적용(꺼 둔 사이트는 켜고 적용)할 때 발급을 시작합니다.
sites.detail.https.uploadedHint=업로드한 인증서를 쓰려면 설정의 HTTPS에서 '업로드한 인증서 사용'을 고르고 초안을 저장하세요.
sites.detail.https.waitApply=이 사이트를 적용하면 발급을 시작합니다(꺼 둔 사이트는 켜고 적용하세요).
sites.detail.https.issueNow=지금 발급
sites.detail.https.issueNote=도메인이 이 서버를 가리키고 인터넷에서 80 포트로 들어올 수 있어야 합니다. 실패하면 사유가 여기에 보이고, 잠시 뒤 자동으로 다시 시도합니다.
msg.cert.issueAfterApply=HTTPS(Let's Encrypt)를 켜 두었습니다. 이 사이트를 적용하면 인증서 발급을 시작합니다.
certs.list.issue.title=Let's Encrypt 인증서 받기
certs.list.issue.intro=HTTPS 없이 만든 사이트에 무료 인증서를 받아 HTTPS를 켭니다. 받으면 사이트 설정에 HTTPS가 자동으로 적용되고, 만료 전에 자동으로 갱신됩니다. 아직 적용하지 않은 사이트는 적용할 때 받습니다.
certs.list.issue.empty=인증서가 필요한 사이트가 없습니다. 폼으로 관리하는 사이트는 모두 HTTPS를 쓰고 있습니다.
certs.list.issue.site=사이트
certs.list.issue.siteHint=사이트의 대표·추가 도메인이 모두 한 인증서에 들어갑니다. 도메인이 이 서버를 가리키고 인터넷에서 80 포트로 들어올 수 있어야 합니다.
certs.list.issue.submit=발급받기

