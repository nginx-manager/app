# --- site import (spec 005)
import.title=설정 파일 가져오기
import.backToSites=사이트 목록
import.help=nginx 설정 파일을 읽어 사이트로 등록합니다. 폼으로 옮길 수 있는 파일은 폼 사이트로, 그 밖의 파일은 원문 그대로 원문 사이트로 등록되고, 다른 변경과 같이 적용 화면에서 확인한 뒤 반영됩니다.
import.bulk.done={0}개 사이트 초안을 만들었습니다: {1}.
import.bulk.failed=등록하지 못한 파일(미리 보기에서 이유를 확인하세요): {0}
import.sources.title=가져오기 위치
import.sources.help=경로 패턴을 등록해 두면 언제든 다시 검사해 새로 생긴 파일과 원본이 바뀐 사이트를 볼 수 있습니다. * 는 디렉터리 한 단계, ** 는 여러 단계와 맞습니다.
import.sources.remove=빼기
import.sources.empty=등록한 위치가 없습니다.
import.sources.add=위치 등록
import.sources.scan=등록한 위치 모두 검사
import.pattern=경로 패턴
import.pattern.hint=예: /home/*/nginx/*.conf, conf.d/*.conf(설정 루트 기준)
import.roots=찾을 수 있는 디렉터리
import.roots.help=관리도구 컨테이너가 보는 경로입니다. 호스트의 다른 디렉터리(/home 등)는 서버에서 sudo nm import-root add /home 으로 같은 경로에 붙여야 찾을 수 있습니다.
import.once.title=한 번만 찾기
import.once.hint=등록하지 않고 파일 하나의 경로나 패턴을 검사합니다.
import.once.submit=검사
import.upload.title=내 PC의 파일 올리기
import.upload.file=설정 파일
import.upload.hint=1MB 이하의 UTF-8 텍스트 파일
import.upload.submit=올려서 미리 보기
import.scan.none=맞는 파일이 없습니다.
import.scan.truncated=찾은 파일이 너무 많아 앞의 200개만 보입니다. 패턴을 좁히세요.
import.scan.denied=권한이 없어 열지 못한 곳이 있습니다. 관리도구는 UID 10101로 돌기 때문에, 그 사용자가 읽을 수 있어야 합니다. 서버에서 다음을 실행한 뒤 다시 검사하세요.
import.col.file=파일
import.col.domain=도메인
import.col.result=등록 방식
import.mode.form=폼 사이트
import.mode.raw=원문 사이트
import.status.registered=등록됨
import.status.changed=원본 바뀜
import.status.taken=도메인 겹침
import.status.invalid=등록 불가
import.preview=미리 보기
import.removeSource.bulk=설정 루트(/etc/nginx) 안의 원본은 지우기(사이트 파일로 옮김)
import.bulk.help=고른 파일은 폼으로 옮길 수 있으면 폼 사이트로, 아니면 원문 사이트로 등록되고 대표 도메인은 첫 server_name입니다. 다르게 정하려면 미리 보기에서 하나씩 등록하세요.
import.bulk.submit=고른 파일 등록(초안)
import.preview.title=가져오기 미리 보기
import.preview.existing=이 파일에서 가져온 사이트가 이미 있습니다:
import.preview.missingPaths=이 설정이 가리키는 파일이 nginx 컨테이너에 없습니다. 이대로 적용하면 문법 검증(nginx -t)에서 실패합니다.
import.preview.certbot=Certbot이 만든 설정입니다. Certbot이 넣은 줄(# managed by Certbot)과 443 server 블록을 지우고 80 server만 가져와 폼 사이트로 등록한 뒤, 사이트 화면에서 HTTPS(Let's Encrypt)를 켜세요. 인증서는 관리도구가 새로 받고 갱신합니다.
import.preview.missingPaths.fix=그 파일이 있는 호스트 디렉터리를 서버에서 sudo nm import-root add <디렉터리> 로 붙이거나, 관리도구에서 같은 설정을 만드세요.
import.preview.result=해석 결과
import.preview.servers=server 블록 {0}개
import.preview.changes=폼으로 옮기면 바뀌는 점
import.preview.unsupported=폼으로 옮길 수 없는 설정(원문 그대로 등록합니다)
import.preview.primaryDomain=대표 도메인
import.preview.primaryDomain.hint=사이트 이름과 파일 이름(conf.d/sites/<도메인>.conf)이 됩니다.
import.preview.mode=등록 방식
import.preview.mode.hint=폼 사이트는 사이트 화면의 폼으로, 원문 사이트는 원문 편집기로 고칩니다.
import.removeSource=원본 {0} 지우기(사이트 파일로 옮김)
import.removeSource.hint=원본을 남겨 두면 nginx가 같은 server를 두 번 읽을 수 있습니다. 사이트 초안과 원본 삭제는 함께 적용되고, 둘 중 하나를 버리면 함께 버려집니다.
import.keepSource.hint=설정 루트 밖의 원본은 읽기만 하고 그대로 둡니다. 원본이 바뀌면 사이트 화면에서 알려 줍니다.
import.preview.submit=사이트로 등록(초안)
import.preview.original=원본
import.preview.rendered=폼 사이트로 만들 설정(원본과 비교)
import.detail.imported=설정 파일을 가져와 사이트 초안을 만들었습니다.
import.detail.source=가져온 원본
import.detail.reimport=원본에서 다시 가져오기
import.detail.reimport.hint=가져온 뒤 원본이 바뀌었습니다. 다시 가져오면 바뀐 내용으로 초안을 만듭니다(HTTPS 등 관리도구에서만 정한 설정은 그대로 둡니다).
import.error.syntax=nginx 문법으로 읽을 수 없습니다: {0}
import.error.mainConfig={0} 블록이 있는 nginx 전체 설정 파일입니다. server 블록만 담긴 파일을 지정하세요.
import.error.noServer=server 블록이 없어 사이트로 등록할 수 없습니다. 파일 편집기에서 관리하세요.
import.error.pattern=경로 패턴이 올바르지 않습니다: {0}
