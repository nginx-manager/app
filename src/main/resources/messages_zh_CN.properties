dashboard.modules.unknown=暂无此模块的说明，请在 nginx 文档中按名称查找。
module.desc.compat=保持二进制兼容，使在其他地方编译的动态模块也能加载到此 nginx。
module.desc.file-aio=使用异步 I/O 读取磁盘文件。发送大文件时可用 aio 指令开启。
module.desc.threads=启用线程池，把较慢的磁盘读取交给单独线程，避免阻塞请求处理（aio threads）。
module.desc.pcre-jit=用 JIT 编译 location 和 rewrite 中的正则表达式，匹配更快。
module.desc.debug=可输出详细的调试日志。把 error_log 设为 debug 级别即可生效。
module.desc.http_addition_module=在响应正文前后附加另一个请求的结果（add_before_body、add_after_body）。
module.desc.http_auth_request_module=每个请求先询问单独的认证服务，只有允许时才放行（auth_request）。
module.desc.http_dav_module=支持通过 WebDAV 的 PUT、DELETE、MKCOL、COPY、MOVE 上传和管理文件（dav_methods）。
module.desc.http_degradation_module=内存不足时对部分请求返回错误，让服务器继续运行。
module.desc.http_flv_module=支持从任意位置开始播放 FLV 视频（flv）。
module.desc.http_gunzip_module=对不支持 gzip 的客户端，把压缩的响应解压后再发送（gunzip）。
module.desc.http_gzip_static_module=如有预先压缩好的 .gz 文件，直接发送该文件（gzip_static）。
module.desc.http_mp4_module=支持从任意位置开始播放 MP4 视频（mp4）。
module.desc.http_random_index_module=对目录请求随机返回其中的一个文件（random_index）。
module.desc.http_realip_module=位于代理或负载均衡器之后时，从 X-Forwarded-For 等请求头获取真实客户端 IP（set_real_ip_from）。
module.desc.http_secure_link_module=只允许通过带签名和过期时间的链接访问文件（secure_link）。
module.desc.http_slice_module=把大文件分片获取并缓存，适合大文件的代理缓存（slice）。
module.desc.http_ssl_module=提供 HTTPS。配置了证书的站点依靠此模块运行（listen ... ssl）。
module.desc.http_stub_status_module=显示当前连接数、已处理请求数等基本状态信息（stub_status）。
module.desc.http_sub_module=替换响应正文中的字符串后再发送（sub_filter）。
module.desc.http_v2_module=支持 HTTP/2，在一个连接上同时传输多个请求（http2 on）。
module.desc.http_v3_module=支持基于 QUIC 的 HTTP/3（listen ... quic）。
module.desc.google_perftools_module=使用 Google perftools 分析工作进程的 CPU 使用情况（google_perftools_profiles）。
module.desc.mail=启用 IMAP、POP3、SMTP 邮件代理（mail 块）。
module.desc.mail_ssl_module=为邮件代理提供 SSL/TLS 和 STARTTLS。
module.desc.stream=原样转发 TCP 和 UDP 连接的流代理，用于数据库、邮件服务器等非 HTTP 服务。可在流代理页面创建(stream 块)。
module.desc.stream_realip_module=在流代理中使用通过 PROXY 协议收到的真实客户端地址（set_real_ip_from）。
module.desc.stream_ssl_module=在流代理中接受 TLS 连接，或通过 TLS 连接后端。
module.desc.stream_ssl_preread_module=无需解密 TLS 即可读取请求的域名（SNI），据此分发连接（ssl_preread）。
module.desc.http_xslt_module=使用 XSLT 样式表转换 XML 响应（xslt_stylesheet）。
module.desc.http_image_filter_module=实时缩放、裁剪或旋转 JPEG、GIF、PNG、WebP 图片（image_filter）。
module.desc.http_geoip_module=通过 GeoIP 数据库查出客户端 IP 的国家和城市，并作为变量使用（geoip_country）。
module.desc.stream_geoip_module=在流代理中通过 GeoIP 查出客户端的国家和城市（geoip_country）。
module.desc.http_perl_module=在配置中使用 Perl 编写的处理程序和变量（perl、perl_set）。
module.desc.njs=用 JavaScript 编写请求处理和变量，HTTP 和流均可使用（js_import、js_content）。
sites.field.type.REDIRECT=重定向
sites.list.type.REDIRECT=重定向
sites.redirect.target=重定向 URL
sites.redirect.target.hint=请求要转到的地址，例如 https://new.example.com。用 nginx 的 return 指令生成。
sites.redirect.code=状态码
sites.redirect.code.301=301 永久移动(搜索引擎会换成新地址)
sites.redirect.code.302=302 临时移动
sites.redirect.code.307=307 临时重定向(保留 POST 等方法)
sites.redirect.code.308=308 永久重定向(保留 POST 等方法)
sites.redirect.keepPath=保留请求路径和查询字符串
sites.redirect.keepPath.hint=开启后，/a?b=1 的请求会转到 目标地址/a?b=1。关闭后，所有请求都转到同一个目标地址。
sites.opt.access.title=访问限制(IP、Basic 认证、外部认证)
sites.opt.access.intro=保护内部工具和预发布站点。ACME 质询路径不受限制。
sites.opt.allowFrom=允许的地址(留空则全部允许)
sites.opt.allowFrom.hint=每行一个 IP 或 CIDR，例如 10.0.0.0/8。只要填写了一个，不在列表中的地址都会返回 403(allow, deny all)。
sites.opt.denyFrom=拒绝的地址
sites.opt.denyFrom.hint=来自这些地址的请求返回 403(deny)。先于允许列表检查。
sites.opt.authUsers=Basic 认证用户
sites.opt.authUsers.hint=每行写“用户名:密码”即可添加用户或修改密码。只写用户名则保留已保存的密码。删除一行即删除该用户。密码至少 8 个字符，只以哈希形式保存(auth_basic)。
sites.opt.satisfyAny=允许的地址或正确的密码满足其一即可通过
sites.opt.satisfyAny.hint=只在同时使用 IP 限制和密码时有意义。开启后，内网无需密码，外部需要密码；关闭则两者都必须满足(satisfy)。
sites.opt.limit.title=请求速率与并发连接限制
sites.opt.limit.intro=防止单个客户端用大量请求占满服务器。超出的请求返回 429(Too Many Requests)。留空表示不限制。
sites.opt.rateLimit=每个客户端 IP 每秒请求数
sites.opt.rateLimit.hint=例如 10。打开一个页面会同时请求图片和脚本，请留足余量并设置突发值(limit_req)。
sites.opt.rateBurst=突发(一次额外接受的请求数)
sites.opt.rateBurst.hint=例如 20。同时到达的这么多请求会立即处理，之后按每秒请求数限制(limit_req burst)。
sites.opt.connLimit=每个客户端 IP 并发连接数
sites.opt.connLimit.hint=例如 20。限制同时下载许多大文件之类的用法(limit_conn)。
sites.opt.perf.title=性能与安全(压缩、响应头、HTTP/3、请求大小、真实 IP、缓存)
sites.opt.gzip=压缩响应(gzip)
sites.opt.gzip.hint=压缩 HTML、CSS、JavaScript、JSON 等文本响应以减少传输量。静态站点如有预先生成的 .gz 文件则直接发送(gzip, gzip_static)。
sites.opt.securityHeaders=添加安全响应头
sites.opt.securityHeaders.hint=添加 X-Content-Type-Options: nosniff、X-Frame-Options: SAMEORIGIN 和 Referrer-Policy，防范常见浏览器攻击。后端已发送相同响应头时可能重复(add_header)。
sites.opt.hsts=HSTS(浏览器始终使用 HTTPS)
sites.opt.hsts.hint=仅限 HTTPS 站点。浏览器在一年内只通过 HTTPS 打开该域名，开启后很难再关闭 HTTPS，请在 HTTPS 稳定运行后再开启(Strict-Transport-Security)。
sites.opt.http3=HTTP/3(QUIC)
sites.opt.http3.hint=仅限 HTTPS 站点。在 UDP 443 端口提供 HTTP/3，在移动网络等不稳定线路上连接更快。nginx 容器需要开放 443/udp 端口(listen 443 quic, Alt-Svc)。
sites.opt.http3.notReady=当前 nginx.conf 中没有用于 HTTP/3 的 443 default_server 块(listen 443 quic reuseport)。开启前请把该块加入 nginx.conf(见 README)。
sites.opt.maxBodySize=最大请求大小(MB，留空为 1)
