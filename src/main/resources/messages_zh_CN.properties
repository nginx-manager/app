sites.php.target.hint=接收 .php 请求的 PHP-FPM 地址：如 127.0.0.1:9000 的主机:端口，或如 unix:/run/php/php-fpm.sock 的套接字。PHP-FPM 也必须以相同路径看到文档根目录。
sites.php.target=PHP-FPM 地址
sites.list.type.PHP=PHP
sites.field.type.PHP=PHP (PHP-FPM)
sites.field.type.STATIC=静态文件
sites.field.type.hint=反向代理会把请求转发给后端应用服务器；静态文件则直接提供服务器目录中的文件；重定向会把所有请求转到另一个地址(例如域名迁移)。PHP 会提供文档根目录中的文件，并把 .php 请求交给 PHP-FPM(WordPress、Laravel 等)。
sites.field.staticRoot.hint=要提供的目录的绝对路径。URL 指向目录时会显示其中的 index.html(PHP 为 index.php)。
sites.field.httpPort=HTTP 端口
sites.field.httpPort.hint=通常为 80。多个站点可共用同一端口，按域名区分。443、7070、8081、9000 不可使用。
sites.field.redirect=将 HTTP 请求跳转到 HTTPS
sites.field.redirect.hint=开启后，http:// 请求会被永久重定向（301）到 https://。ACME 质询路径（/.well-known/acme-challenge/）除外。
sites.field.certificate=证书
