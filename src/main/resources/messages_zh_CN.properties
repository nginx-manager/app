sites.proxy.target.hint=接收转发请求的后端地址，例如 http://127.0.0.1:8080。填写两个以上时，按下方的负载均衡方式分发。gRPC 服务器请写成 grpc://127.0.0.1:50051（TLS 用 grpcs://），将通过 grpc_pass 转发。不使用 TLS 接收时，请为该站点单独指定 HTTP 端口。
sites.proxy.options=代理高级设置（WebSocket、超时、负载均衡）
sites.proxy.websocket=WebSocket 代理
sites.proxy.websocket.hint=聊天、实时通知等使用 WebSocket 的应用请开启。会把 Upgrade 头传给后端。
sites.proxy.connectTimeout=连接超时（秒，留空为 60）
sites.proxy.connectTimeout.hint=与后端建立连接的最长等待时间。超时后向客户端返回 504 错误。
sites.proxy.readTimeout=响应超时（秒，留空为 60）
sites.proxy.readTimeout.note=对于 WebSocket 或耗时较长的请求，请将响应超时设得长一些（例如 3600）。若后端在此期间没有发送任何数据，连接将被断开。
