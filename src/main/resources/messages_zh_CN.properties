sites.https.intro=选择是否使用 HTTPS，以及证书从哪里来。现在可以先选“不使用”，创建站点后再在站点页面或证书页面签发 Let's Encrypt 证书。
sites.https.mode.NONE=不使用（仅 HTTP）
sites.https.mode.NONE.hint=只用 HTTP 响应。域名还没指向本服务器或是测试用站点时选择此项。
