sites.form.title=添加站点
sites.form.extraDomains=附加域名（以空格或逗号分隔，可选）
sites.form.staticRoot=文档根目录（静态文件）
sites.form.saveNote=保存后不会立即生效到 nginx，需要在应用页面校验后再应用。
sites.form.preview=配置预览
sites.form.preview.empty=填写表单后即可看到将生成的配置。
sites.field.domain=域名
sites.field.domain.hint=此站点的主域名，也用于配置和日志文件名，保存后无法修改。
sites.field.extraDomains.hint=由同一站点处理的其他域名，例如 www.app.example.com。也会一并写入 Let's Encrypt 证书。
sites.field.type=类型
sites.field.type.PROXY=反向代理
sites.field.type.STATIC=静态文件
sites.field.type.hint=反向代理会把请求转发给后端应用服务器；静态文件则直接提供服务器目录中的文件。
sites.field.staticRoot.hint=静态站点要提供的目录的绝对路径。URL 指向目录时会显示其中的 index.html。
sites.field.httpPort=HTTP 端口
sites.field.httpPort.hint=通常为 80。多个站点可共用同一端口，按域名区分。443、8081、9000 不可使用。
sites.field.httpsEnabled=启用 HTTPS（443）
sites.field.redirect=将 HTTP 请求跳转到 HTTPS
sites.field.redirect.hint=开启后，http:// 请求会被永久重定向（301）到 https://。证书签发验证路径除外。
sites.field.certificate=证书
sites.field.certificate.letsEncrypt=Let's Encrypt 自动签发
sites.field.certificate.uploaded={0}（已上传）
sites.field.certificate.note=选择 Let's Encrypt 后，会在应用后获取证书并自动重新应用 HTTPS 配置。获取证书之前仅通过 HTTP 响应。
sites.field.certificate.hint=通配符域名（*.example.com）无法通过 Let's Encrypt 获取，请上传证书。
sites.field.saveDraft=保存草稿
sites.proxy.target=代理目标（反向代理，多个时每行一个）
sites.proxy.target.hint=接收转发请求的后端地址，例如 http://127.0.0.1:8080。填写两个以上时，按下方的负载均衡方式分发。
sites.proxy.options=代理高级设置（WebSocket、超时、负载均衡）
sites.proxy.websocket=转发 WebSocket 连接
sites.proxy.websocket.hint=聊天、实时通知等使用 WebSocket 的应用请开启。会把 Upgrade 头传给后端。
sites.proxy.connectTimeout=连接超时（秒，留空为 60）
sites.proxy.connectTimeout.hint=与后端建立连接的最长等待时间。超时后向客户端返回 504 错误。
sites.proxy.readTimeout=响应超时（秒，留空为 60）
sites.proxy.readTimeout.note=对于 WebSocket 或耗时较长的请求，请将响应超时设得长一些（例如 3600）。若后端在此期间没有发送任何数据，连接将被断开。
sites.proxy.loadBalancing=多个后端时的分发方式
sites.proxy.loadBalancing.hint=仅在有两个以上代理目标时使用。如果应用把登录会话保存在服务器内存中，请选择把同一 IP 发往同一后端的方式。
enum.LoadBalancing.ROUND_ROBIN=轮询（默认）
enum.LoadBalancing.LEAST_CONN=发往连接数最少的后端
enum.LoadBalancing.IP_HASH=同一客户端 IP 发往同一后端
