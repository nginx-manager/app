sites.https.mode.LETS_ENCRYPT.hint=应用后会签发证书并自动加上 HTTPS 配置，到期前自动续期。站点的主域名和附加域名都必须指向本服务器，并能从互联网通过 80 端口访问。拿到证书前站点只用 HTTP 响应。不支持通配符域名（*.example.com）。
sites.https.mode.UPLOADED=使用已上传的证书
sites.https.mode.UPLOADED.hint=使用自己获取并在证书页面上传的证书，例如通配符证书或内部 CA 证书。不会自动续期。
