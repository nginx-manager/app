sites.opt.authRequestUrl=外部认证服务器 (auth_request)
sites.opt.authRequestUrl.hint=每个请求都会先询问此地址：返回 2xx 则放行，返回 401、403 则拒绝。用于 oauth2-proxy(http://oauth2-proxy:4180/oauth2/auth)、Authelia、Authentik 等 SSO 前端。留空则不使用。
sites.opt.authSignInUrl=登录地址 (可选)
sites.opt.authSignInUrl.hint=认证服务器返回 401 时跳转到此地址，并通过 rd 参数附上原地址。例如 https://auth.example.com/oauth2/start。留空则直接返回 401。
msg.validation.authRequestUrl=外部认证服务器请写成 http(s)://主机[:端口]/路径 格式。
msg.validation.authSignInUrl=登录地址请写成 http(s)://主机[:端口]/路径 格式。
sites.opt.routes.title=按路径路由（location）
sites.opt.pathRoutes=路径与目标（每行一个）
sites.opt.pathRoutes.hint=每行写“路径 目标”，该路径下的请求就会发往目标（location ^~）。目标为 http(s):// 地址时进行代理；为以 / 开头的目录时直接返回该目录中的文件（alias）。代理地址末尾带路径（包括 /）时，会去掉 location 路径后再转发。访问限制和速率限制同样作用于这些路径。例如：/api/ http://127.0.0.1:8080/
msg.validation.pathRoutes=按路径路由每行请写成“/路径 http(s)://主机[:端口][/路径]”或“/路径 /目录”。不能只写 /、不能重复同一路径、不能使用管理工具占用的目录和端口，最多 50 行。
msg.validation.pathRoutesGrpc=gRPC 代理站点不能使用按路径路由。
sites.proxy.backupTargets=备用上游（每行一个）
sites.proxy.backupTargets.hint=平时不接收请求，只有上面的上游全部失败时才接收（upstream 的 backup）。请使用与上面上游相同的 http/https 和路径。负载均衡方式为“同一客户端 IP 发往同一后端”（ip_hash）时不能使用。
sites.proxy.maxFails=故障判定：失败次数（留空为 1）
sites.proxy.maxFails.hint=在排除时间内连接或响应失败达到此次数时，该上游会在排除时间内被移出（max_fails、fail_timeout）。
sites.proxy.failTimeout=故障判定：排除时间（秒，留空为 10）
sites.proxy.keepalive=keepalive 连接数
sites.proxy.keepalive.hint=与上游的连接不断开，保留此数量的空闲连接重复使用（keepalive）。请求量大时可减少建立连接的开销。上游需要支持 HTTP/1.1 keep-alive。
msg.validation.backupTargets=备用上游请写成与上面上游相同 http/https 和路径的地址，最多 32 个。不能使用管理工具的端口。
msg.validation.backupIpHash=负载均衡方式为 ip_hash 时不能使用备用上游（nginx 不接受）。
msg.validation.upstreamMaxFails=失败次数为 1 到 100。
msg.validation.upstreamFailTimeout=排除时间为 1 到 3600 秒。
msg.validation.upstreamKeepalive=keepalive 连接数为 1 到 1024。
sites.opt.maintenance.title=维护模式
sites.opt.maintenance=开启维护模式
sites.opt.maintenance.hint=开启并应用后，访问者会看到 503 和下面的提示文字（Retry-After 10 分钟）。证书签发路径不受影响。关闭后再次应用即可恢复正常。
sites.opt.maintenanceMessage=提示文字（留空使用默认文字）
sites.opt.maintenanceMessage.placeholder=服务维护中，请稍后再访问。
sites.opt.maintenanceAllowFrom=维护期间仍可访问的地址
sites.opt.maintenanceAllowFrom.hint=维护人员的 IP 或 CIDR。来自这些地址的请求在维护期间仍可正常访问站点。
sites.status.maintenance=维护中
msg.validation.maintenanceMessage=提示文字最多 500 个字符，不能包含单引号（'）、反斜杠、$ 和花括号。

# 022 自定义头部、023 汇集到主域名、024 复制站点
sites.opt.headers.title=自定义头部
sites.opt.responseHeaders=响应头
sites.opt.responseHeaders.hint=每行一个“名称: 值”，加到所有响应上(add_header … always)。用于 CORS、Content-Security-Policy、X-Robots-Tag 等。可以使用 $host 等 nginx 变量。
sites.opt.requestHeaders=发送到后端的头部
sites.opt.requestHeaders.hint=每行一个“名称: 值”(proxy_set_header)。写 Host 时用该值代替默认值($host)，值留空(“名称:”)则删除该头部。X-Real-IP、X-Forwarded-*、Upgrade、Connection 由管理工具设置。
sites.opt.redirectToPrimary=把附加域名转到主域名
sites.opt.redirectToPrimary.hint=发往附加域名(www 等)的请求以 301 转到主域名，路径和查询保持不变。证书仍像现在一样一起申请。
sites.detail.copy=复制
sites.form.copied=已复制 {0} 的设置。请填写域名后保存。密码保护用户和上传的证书不会复制。
msg.validation.headers=头部每行一个“名称: 值”，最多 20 行。名称以字母开头(字母、数字、- 和 _，64 个字符)，值最多 500 个字符，不能包含双引号(")或反斜杠。同一名称只能出现一次。
msg.validation.requestHeaders=后端头部每行一个“名称: 值”，最多 20 行，值中不能包含双引号(")或反斜杠。X-Real-IP、X-Forwarded-For、X-Forwarded-Proto、Upgrade、Connection 由管理工具设置，不能填写。

# 025 流的访问限制、026 后端故障提示页、027 站点列表搜索
streams.field.allowFrom=允许的地址
streams.field.allowFrom.hint=用空格、逗号或换行分隔 IP 或 CIDR。填写后只接受来自这些地址的连接，留空则不限制。拒绝的地址优先生效。
streams.field.denyFrom=拒绝的地址
streams.field.proxyProtocol=用 PROXY protocol 传递客户端地址 (TCP)
streams.field.proxyProtocol.hint=在每个连接前加上 PROXY protocol 头，让后端看到真实客户端 IP(proxy_protocol on)。后端必须配置为接受 PROXY protocol(HAProxy、nginx 的 listen … proxy_protocol 等)，否则连接会出错。
streams.badge.restricted=访问限制
sites.opt.backendError.title=后端故障提示页
sites.opt.backendErrorPage=后端故障时显示提示页
sites.opt.backendErrorPage.hint=当 nginx 因无法连接后端或后端响应超时而返回 502、504 时，显示提示文字而不是默认错误页。后端自己返回的错误响应保持不变。
sites.opt.backendErrorMessage=提示文字
sites.opt.backendErrorMessage.placeholder=留空时的默认文字：服务暂时无法访问，请稍后再试。
