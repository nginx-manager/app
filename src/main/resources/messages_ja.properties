import.roots=検索できるディレクトリ
import.roots.help=管理ツールのコンテナから見えるパスです。ホストのほかのディレクトリ(/home など)は、サーバーで sudo nm import-root add /home を実行して同じパスに接続します。
import.once.title=一度だけ検索
import.once.hint=登録せずにファイルのパスやパターンを検査します。
import.once.submit=検査
import.upload.title=PC のファイルをアップロード
import.upload.file=設定ファイル
import.upload.hint=1MB 以下の UTF-8 テキストファイル
import.upload.submit=アップロードしてプレビュー
import.scan.none=一致するファイルはありません。
import.scan.truncated=一致が多すぎるため先頭 200 件のみ表示します。パターンを絞ってください。
import.scan.denied=権限がなく開けなかった場所があります。管理ツールは UID 10101 で動くため、そのユーザーが読める必要があります。サーバーで次を実行してから、もう一度検査してください。
import.col.file=ファイル
import.col.domain=ドメイン
import.col.result=登録方法
import.mode.form=フォームサイト
import.mode.raw=原文サイト
import.status.registered=登録済み
import.status.changed=元ファイル変更あり
import.status.taken=ドメイン重複
import.status.invalid=登録不可
import.preview=プレビュー
import.removeSource.bulk=設定ルート(/etc/nginx)内の元ファイルは削除する(サイトファイルへ移動)
import.bulk.help=選んだファイルはフォームに移せればフォームサイト、そうでなければ原文サイトとして登録され、代表ドメインは最初の server_name です。変えるにはプレビューから 1 件ずつ登録してください。
import.bulk.submit=選んだファイルを登録(下書き)
import.preview.title=取り込みプレビュー
import.preview.existing=このファイルから取り込んだサイトがすでにあります:
import.preview.missingPaths=この設定が参照するファイルが nginx コンテナにありません。このまま適用すると構文チェック(nginx -t)で失敗します。
import.preview.certbot=Certbot が作った設定です。Certbot が追加した行(# managed by Certbot)と 443 の server ブロックを消して 80 の server だけをフォームサイトとして取り込み、サイト画面で HTTPS(Let's Encrypt)をオンにしてください。証明書は管理ツールが取得・更新します。
import.preview.missingPaths.fix=そのファイルがあるホストのディレクトリをサーバーで sudo nm import-root add <ディレクトリ> で接続するか、管理ツールで同じ設定を作ってください。
import.preview.result=解析結果
import.preview.servers=server ブロック {0} 個
import.preview.changes=フォームに移すと変わる点
import.preview.unsupported=フォームに移せない設定(原文のまま登録します)
import.preview.primaryDomain=代表ドメイン
import.preview.primaryDomain.hint=サイト名とファイル名(conf.d/sites/<ドメイン>.conf)になります。
import.preview.mode=登録方法
import.preview.mode.hint=フォームサイトはサイト画面のフォームで、原文サイトは原文エディターで編集します。
import.removeSource=元ファイル {0} を削除する(サイトファイルへ移動)
import.removeSource.hint=元ファイルを残すと nginx が同じ server を 2 回読むことがあります。サイトの下書きと元ファイルの削除は一緒に適用され、どちらかを破棄すると両方破棄されます。
import.keepSource.hint=設定ルート外の元ファイルは読むだけでそのまま残します。変わるとサイト画面でお知らせします。
import.preview.submit=サイトとして登録(下書き)
import.preview.original=元ファイル
import.preview.rendered=フォームサイトが書く設定(元ファイルとの比較)
import.detail.imported=設定ファイルを取り込み、サイトの下書きを作成しました。
import.detail.source=取り込み元
import.detail.reimport=元ファイルから再取り込み
import.detail.reimport.hint=取り込み後に元ファイルが変わりました。再取り込みすると新しい内容で下書きを作ります(HTTPS など管理ツールだけで決めた設定はそのままです)。
import.error.syntax=nginx の文法として読めません: {0}
import.error.mainConfig={0} ブロックを含む nginx 全体の設定ファイルです。server ブロックだけのファイルを指定してください。
import.error.noServer=server ブロックがないためサイトとして登録できません。ファイルエディターで管理してください。
