dashboard.modules.unknown=このモジュールの説明はまだありません。nginx のドキュメントで名前を検索してください。
module.desc.compat=別の環境でビルドした動的モジュールも読み込めるよう、バイナリ互換性を保ちます。
module.desc.file-aio=ディスク上のファイルを非同期 I/O で読み込みます。大きなファイルを配信するときに aio ディレクティブで有効にします。
module.desc.threads=スレッドプールを使います。遅いディスク読み込みを別スレッドに回し、リクエスト処理が止まらないようにします（aio threads）。
module.desc.pcre-jit=location や rewrite の正規表現を JIT コンパイルして高速に照合します。
module.desc.debug=詳細なデバッグログを出せます。error_log を debug レベルにすると有効になります。
module.desc.http_addition_module=レスポンス本文の前後に別リクエストの結果を追加します（add_before_body、add_after_body）。
module.desc.http_auth_request_module=リクエストごとに別の認証サーバーへ問い合わせ、許可された場合だけ通します（auth_request）。
module.desc.http_dav_module=WebDAV の PUT、DELETE、MKCOL、COPY、MOVE でファイルのアップロードや削除を可能にします（dav_methods）。
module.desc.http_degradation_module=メモリが不足したとき、一部のリクエストにエラーを返してサーバーを持ちこたえさせます。
module.desc.http_flv_module=FLV 動画を任意の位置から再生できるように配信します（flv）。
module.desc.http_gunzip_module=gzip に対応していないクライアントには、圧縮済みのレスポンスを展開して送ります（gunzip）。
module.desc.http_gzip_static_module=あらかじめ圧縮した .gz ファイルがあればそのまま送ります（gzip_static）。
module.desc.http_mp4_module=MP4 動画を任意の位置から再生できるように配信します（mp4）。
module.desc.http_random_index_module=ディレクトリへのリクエストに、その中のファイルを無作為に選んで返します（random_index）。
module.desc.http_realip_module=プロキシやロードバランサーの背後にあるとき、X-Forwarded-For などのヘッダーから実際のクライアント IP を取得します（set_real_ip_from）。
module.desc.http_secure_link_module=署名と有効期限を含むリンクからだけファイルにアクセスできるようにします（secure_link）。
module.desc.http_slice_module=大きなファイルを分割して取得・キャッシュします。大容量ファイルのプロキシキャッシュに使います（slice）。
module.desc.http_ssl_module=HTTPS を提供します。証明書を設定したサイトはこのモジュールで動作します（listen ... ssl）。
module.desc.http_stub_status_module=現在の接続数や処理したリクエスト数などの基本的な状態を表示します（stub_status）。
module.desc.http_sub_module=レスポンス本文の文字列を別の文字列に置き換えて送ります（sub_filter）。
module.desc.http_v2_module=HTTP/2 に対応します。1 つの接続で複数のリクエストを同時にやり取りします（http2 on）。
module.desc.http_v3_module=QUIC 上で動作する HTTP/3 に対応します（listen ... quic）。
module.desc.google_perftools_module=Google perftools でワーカープロセスの CPU 使用状況をプロファイルします（google_perftools_profiles）。
module.desc.mail=IMAP、POP3、SMTP のメールプロキシを使えます（mail ブロック）。
module.desc.mail_ssl_module=メールプロキシで SSL/TLS と STARTTLS を使えます。
module.desc.stream=TCP と UDP の接続をそのまま転送するストリームプロキシです。データベースやメールサーバーなど HTTP 以外のサービスに使います。ストリーム画面で作れます(stream ブロック)。
module.desc.stream_realip_module=ストリームプロキシで、PROXY プロトコルで受け取った実際のクライアントアドレスを使います（set_real_ip_from）。
module.desc.stream_ssl_module=ストリームプロキシで TLS 接続を受けたり、TLS でバックエンドに接続したりします。
module.desc.stream_ssl_preread_module=TLS を復号せずに接続先ドメイン（SNI）を読み取り、接続を振り分けます（ssl_preread）。
module.desc.http_xslt_module=XML レスポンスを XSLT スタイルシートで変換します（xslt_stylesheet）。
module.desc.http_image_filter_module=JPEG、GIF、PNG、WebP 画像をその場で縮小・切り抜き・回転します（image_filter）。
module.desc.http_geoip_module=GeoIP データベースでクライアント IP の国や都市を調べ、変数として使えるようにします（geoip_country）。
module.desc.stream_geoip_module=ストリームプロキシで GeoIP を使い、クライアントの国や都市を調べます（geoip_country）。
module.desc.http_perl_module=Perl で書いたハンドラーや変数を設定の中で使えます（perl、perl_set）。
module.desc.njs=JavaScript でリクエスト処理や変数を書けます。HTTP とストリームの両方で使えます（js_import、js_content）。
sites.field.type.REDIRECT=リダイレクト
sites.list.type.REDIRECT=リダイレクト
sites.redirect.target=転送先アドレス
sites.redirect.target.hint=リクエストを転送するアドレスです。例: https://new.example.com。nginx の return ディレクティブで生成します。
sites.redirect.code=ステータスコード
sites.redirect.code.301=301 恒久的な移動(検索エンジンが新しいアドレスに切り替え)
sites.redirect.code.302=302 一時的な移動
sites.redirect.code.307=307 一時的な移動(POST などのメソッドを維持)
sites.redirect.code.308=308 恒久的な移動(POST などのメソッドを維持)
sites.redirect.keepPath=リクエストのパスとクエリをそのまま付ける
sites.redirect.keepPath.hint=オンにすると /a?b=1 へのリクエストを 転送先/a?b=1 へ送ります。オフにするとすべて転送先アドレスひとつへ送ります。
sites.opt.access.title=アクセス制限(IP、パスワード)
sites.opt.access.intro=社内ツールやステージングサイトを保護します。Let's Encrypt の認証パスは制限しません。
sites.opt.allowFrom=許可するアドレス(空ならすべて許可)
sites.opt.allowFrom.hint=IP または CIDR を1行にひとつ書きます。例: 10.0.0.0/8。ひとつでも書くと、一覧にないアドレスは 403 で拒否します(allow, deny all)。
sites.opt.denyFrom=拒否するアドレス
sites.opt.denyFrom.hint=これらのアドレスからのリクエストは 403 で拒否します(deny)。許可一覧より先に判定します。
sites.opt.authUsers=パスワード保護のユーザー
sites.opt.authUsers.hint=1行に「名前:パスワード」を書くとユーザーの追加やパスワード変更になります。名前だけなら保存済みのパスワードをそのまま使います。行を消すとそのユーザーを削除します。パスワードは8文字以上で、ハッシュとしてのみ保存されます(auth_basic)。
sites.opt.satisfyAny=許可アドレスかパスワードのどちらかが合えば通す
sites.opt.satisfyAny.hint=IP 制限とパスワードを両方使うときだけ意味があります。オンなら社内ネットワークはパスワードなしで、外部はパスワードで入れます。オフなら両方が必要です(satisfy)。
sites.opt.limit.title=リクエスト速度・同時接続の制限
sites.opt.limit.intro=ひとつのクライアントが大量のリクエストでサーバーを塞がないようにします。超えたリクエストは 429(Too Many Requests)で拒否します。空なら制限しません。
sites.opt.rateLimit=クライアント IP あたりの毎秒リクエスト数
sites.opt.rateLimit.hint=例: 10。1ページの表示で画像やスクリプトのリクエストが複数出るので、余裕を持たせてバーストも設定してください(limit_req)。
sites.opt.rateBurst=バースト(一度に追加で受けるリクエスト数)
sites.opt.rateBurst.hint=例: 20。この数までは一度に来てもすぐ処理し、それ以降は毎秒リクエスト数で制限します。
sites.opt.connLimit=クライアント IP あたりの同時接続数
sites.opt.connLimit.hint=例: 20。大きなファイルを同時に多数ダウンロードするような使い方を制限します(limit_conn)。
sites.opt.perf.title=性能・セキュリティ(圧縮、ヘッダー、HTTP/3、リクエストサイズ、実 IP、キャッシュ)
sites.opt.gzip=レスポンスを圧縮(gzip)
sites.opt.gzip.hint=HTML、CSS、JavaScript、JSON などのテキストを圧縮して転送量を減らします。静的サイトでは事前に作った .gz ファイルがあればそれを送ります(gzip, gzip_static)。
sites.opt.securityHeaders=セキュリティヘッダーを付ける
sites.opt.securityHeaders.hint=X-Content-Type-Options: nosniff、X-Frame-Options: SAMEORIGIN、Referrer-Policy を付けて一般的なブラウザー攻撃を防ぎます。バックエンドが同じヘッダーを送っていると重複することがあります(add_header)。
sites.opt.hsts=HSTS(ブラウザーが常に HTTPS で接続)
sites.opt.hsts.hint=HTTPS サイトでのみ使えます。ブラウザーが1年間このドメインを HTTPS でのみ開きます。オンにした後は HTTPS をやめにくくなるので、HTTPS が安定してから有効にしてください(Strict-Transport-Security)。
sites.opt.http3=HTTP/3(QUIC)
sites.opt.http3.hint=HTTPS サイトでのみ使えます。UDP 443 番で HTTP/3 を受け、モバイルのような不安定な回線でより速く接続します。nginx コンテナーの 443/udp を開けておく必要があります(listen 443 quic, Alt-Svc)。
sites.opt.http3.notReady=現在の nginx.conf には HTTP/3 用の 443 デフォルトサーバー(listen 443 quic reuseport)がありません。有効にする前に、既定設定の 443 デフォルトサーバーブロックを nginx.conf に追加してください(README 参照)。
sites.opt.maxBodySize=最大リクエストサイズ(MB、空なら 1)
sites.opt.maxBodySize.hint=ファイルアップロードなど大きなリクエストを受けるときに増やします。超えると 413 エラーを返します。0 なら制限しません(client_max_body_size)。
sites.opt.realIpFrom=信頼するプロキシのアドレス(実クライアント IP)
sites.opt.realIpFrom.hint=この nginx の前にロードバランサーや CDN があるなら、そのアドレスを書きます。そこからのリクエストは下のヘッダーの IP を実際のクライアント IP とみなし、ログ、IP 制限、速度制限に使います(set_real_ip_from)。
sites.opt.realIpHeader=実 IP が入っているヘッダー
sites.opt.cacheMinutes=プロキシキャッシュの保持時間(分、リバースプロキシ)
sites.opt.cacheMinutes.hint=空ならキャッシュしません。設定すると、バックエンドの成功レスポンス(200、301、302)をこの時間保存してすぐに返します。Cache-Control: no-store や Set-Cookie を含むレスポンスはキャッシュしません。ヒットしたかは X-Cache-Status ヘッダーで確認できます(proxy_cache)。
sites.opt.autoindex=ディレクトリー一覧を表示(静的ファイル)
sites.opt.autoindex.hint=index.html のないフォルダーを開くとファイル一覧を表示します。公開してよいファイルだけのフォルダーでのみ有効にしてください(autoindex)。
msg.validation.maxBodySize=最大リクエストサイズは 0〜10240MB です。
msg.validation.rateLimit=毎秒リクエスト数は 1〜100000 です。
msg.validation.rateBurst=バーストは 0〜100000 です。
msg.validation.connLimit=同時接続数は 1〜100000 です。
msg.validation.cacheMinutes=キャッシュ保持時間は 1〜525600 分です。
msg.validation.addresses=IP アドレスか CIDR(例: 10.0.0.0/8)だけを、空白・カンマ・改行で区切って 200 個まで書けます。
msg.validation.authUsers=ユーザー名は英数字と . _ @ - で 64 文字まで、パスワードは 8〜128 文字です。1行に「名前:パスワード」か名前だけを書きます(100人まで)。
msg.validation.redirectTarget=転送先は http:// か https:// で始まり、空白、引用符、$、;、# は使えません。
msg.validation.redirectCode=ステータスコードは 301、302、307、308 のいずれかです。
msg.validation.redirectKeepPath=クエリ(?)のあるアドレスにはリクエストのパスを付けられません。パスの維持をオフにするか、クエリを外してください。
msg.validation.httpsOnlyOption=HSTS と HTTP/3 は HTTPS を有効にしたサイトでのみ使えます。
msg.site.authPasswordRequired=新しいユーザー {0} にはパスワードが必要です。名前:パスワード の形で書いてください。
files.list.new=新規ファイル
files.list.deleted=まだ適用していない新規ファイルの下書きを削除しました。
files.new.title=新しい設定ファイル
files.new.help=フォームのないモジュール(njs スクリプト、mail・stream の設定、Perl モジュール、XSLT スタイルシートなど)を使うときに、設定ルート(/etc/nginx)の下にファイルを作ります。作ったファイルは下書きで、適用画面で nginx -t による検証の後に反映されます。nginx に読ませるには、そのファイルを include または読み込む設定が必要です。
files.new.path=パス(/etc/nginx 基準)
files.new.path.hint=例: stream.d/mqtt.conf、njs/auth.js。英数字と . _ - / だけが使え、certs/ と htpasswd/ には作れません。
files.new.content=内容
files.new.submit=下書きとして作成
files.new.error.path=使えないパスです。英数字と . _ - / だけを使い、.. やドットで始まる名前、certs/ と htpasswd/ の下は使えません。
files.new.error.exists=既にあるファイルです。設定ファイル一覧から開いて編集してください。
files.new.where.stream=nginx.conf の stream ブロックが読み込みます。ストリーム画面では作れない設定(SNI による振り分けなど)を置きます。
files.new.where.sites=http ブロックが読み込みます。ここに作ったファイルは適用すると直接編集サイトとしてサイト一覧に表示されます。
files.new.where.njs=njs スクリプト。nginx.conf やサイト設定で js_import njs/ファイル.js; として読み込みます。
files.new.where.main=mail ブロックのような最上位の設定は、nginx.conf に include 行を加えて読み込みます。
files.edit.delete=このファイルを削除(下書き)
files.edit.delete.hint=削除する下書きを作ります。適用するとサーバーから削除され、それまでは適用画面で下書きを破棄して元に戻せます。サイトのファイルはサイト画面の無効化で扱います。
files.edit.deleted.before=このファイルを削除する下書きがあります。
files.edit.deleted.after=で反映するか、下書きを破棄してください。
nav.streams=ストリーム
streams.list.title=ストリーム(TCP/UDP プロキシ)
streams.list.add=ストリームを追加
streams.list.help=データベース、MQTT、ゲームサーバーなど HTTP 以外のサービスを nginx の背後に置きます。受けた TCP/UDP 接続を中身を見ずにそのままバックエンドへ渡します(stream モジュール)。設定は stream.d/ の下のファイル1つとして作られ、サイトと同じく適用画面で検証してから反映されます。
streams.list.empty=登録されたストリームはありません。
streams.list.col.listen=受けるポート
streams.list.col.backends=バックエンド
streams.list.col.note=メモ
streams.list.deleted.before=ストリームを削除する下書きを作りました。
streams.badge.raw=直接編集
streams.form.title=ストリームを追加
streams.form.portNote=外部から接続するには nginx コンテナーでこのポートを開ける必要があります。docker-compose.yml の nginx サービスの ports に "ポート:ポート"(UDP は "ポート:ポート/udp")を追加して再起動してください。
streams.field.protocol=プロトコル
streams.field.protocol.hint=データベース、MQTT、SSH、Redis のように接続を保つサービスは TCP、DNS、syslog、一部のゲームサーバーは UDP です。
streams.field.listenPort=受けるポート
streams.field.listenPort.hint=nginx が接続を受けるポートです。プロトコルとポートが設定ファイル名(stream.d/tcp-5432.conf)になり、保存後は変更できません。80、443、7070、8081、9000 とサイトが使うポートは使えません。
streams.field.backends=バックエンド(ホスト:ポート、複数なら1行にひとつ)
streams.field.backends.hint=接続を渡すサーバーです。例: 10.0.0.5:5432、db:5432。ホスト名は nginx が設定を読むときに一度だけ解決するので、その時点で解決できる必要があります。
streams.field.loadBalancing=バックエンドが複数あるときの振り分け方
streams.field.loadBalancing.hint=バックエンドが2つ以上のときだけ使われます。接続が移ると状態が失われるサービス(ゲーム、セッションを覚えるサーバー)は、同じ IP を同じバックエンドへ送ってください。
streams.field.connectTimeout=接続タイムアウト(秒、空なら 60)
streams.field.connectTimeout.hint=バックエンドとの接続を待つ時間です。超えると次のバックエンドを試します(proxy_connect_timeout)。
streams.field.idleTimeout=アイドルタイムアウト(秒、空なら 600)
streams.field.idleTimeout.hint=この時間どちらからも何も送られないと接続を切ります。長く保つ DB・MQTT 接続では長めにしてください(proxy_timeout)。
streams.field.note=メモ
streams.field.note.hint=何のためのストリームかを書いておきます。設定ファイル先頭のコメントにも入ります。
streams.detail.fixedPort=プロトコルとポートは変更できません。変えるにはこのストリームを削除して新しく作ってください。
streams.detail.raw.body=このストリームファイルは直接編集されたか手で作られたため、直接編集でのみ管理します。フォームが設定を上書きすることはありません。
streams.detail.ports=外部から接続するには docker-compose.yml の nginx サービスの ports に "{0}:{0}{1}" を追加してください。
streams.detail.delete=ストリームを削除(下書き)
enum.StreamBalancing.ROUND_ROBIN=順番に(既定)
enum.StreamBalancing.LEAST_CONN=接続数が最も少ないバックエンドへ
enum.StreamBalancing.IP_HASH=同じクライアント IP は同じバックエンドへ
msg.validation.streamPort=ポートは 1〜65535 です。
msg.validation.streamIdleTimeout=アイドルタイムアウトは 1〜86400 秒です。
msg.validation.streamBackends=バックエンドはホスト:ポートの形式で 1〜32 個書いてください。例: 10.0.0.5:5432
msg.validation.streamReservedPort=このポートは HTTP(80、443)か管理ツール(7070、8081、9000)が使います。UDP は 443(HTTP/3)だけが使えません。
msg.stream.portTaken={0} 番ポートは既に {1} が使っています。

# HTTPS 선택(사용 안 함 / Let's Encrypt / 업로드)과 등록 후 발급
sites.https.intro=HTTPS を使うか、使う場合は証明書をどう用意するかを選びます。今は「使わない」のままにして、サイトを作った後でサイト画面や証明書画面から Let's Encrypt 証明書を取得することもできます。
sites.https.mode.NONE=使わない（HTTP のみ）
sites.https.mode.NONE.hint=HTTP のみで応答します。ドメインがまだこのサーバーを向いていない場合や、テスト用サイトのときに選びます。
sites.https.mode.LETS_ENCRYPT=Let's Encrypt 証明書を取得（無料・自動更新）
sites.https.mode.LETS_ENCRYPT.hint=適用すると証明書を取得して HTTPS 設定を自動で追加し、期限前に更新します。代表・追加ドメインがすべてこのサーバーを向き、インターネットから 80 番ポートで到達できる必要があります。取得するまでは HTTP のみで応答します。ワイルドカードドメイン（*.example.com）は取得できません。
sites.https.mode.UPLOADED=アップロードした証明書を使う
sites.https.mode.UPLOADED.hint=ワイルドカード証明書や社内 CA 証明書など、自分で取得して証明書画面にアップロードした証明書を使います。自動では更新されません。
sites.https.mode.UPLOADED.none=まだアップロードした証明書がありません。
sites.https.mode.UPLOADED.link=証明書画面でアップロード
sites.https.chooseCertificate=証明書を選んでください
msg.validation.certificateRequired=使用するアップロード証明書を選んでください。
sites.detail.https.enableNoteNotLive=このサイトはまだ nginx に反映されていないか、無効になっています。今押しておくと、サイトを適用したとき（無効なサイトは有効にして適用したとき）に取得を始めます。
sites.detail.https.uploadedHint=アップロードした証明書を使う場合は、設定の HTTPS で「アップロードした証明書を使う」を選び、下書きを保存してください。
sites.detail.https.waitApply=このサイトを適用すると取得を始めます（無効なサイトは有効にしてから適用してください）。
sites.detail.https.issueNow=今すぐ取得
sites.detail.https.issueNote=ドメインがこのサーバーを向き、インターネットから 80 番ポートで到達できる必要があります。失敗すると理由がここに表示され、しばらくして自動で再試行します。
msg.cert.issueAfterApply=HTTPS（Let's Encrypt）を有効にしました。このサイトを適用すると証明書の取得を始めます。
certs.list.issue.title=Let's Encrypt 証明書を取得
certs.list.issue.intro=HTTPS なしで作ったサイトに無料の証明書を取得して HTTPS を有効にします。取得するとサイト設定に HTTPS が自動で適用され、期限前に自動更新されます。まだ適用していないサイトは適用時に取得します。
certs.list.issue.empty=証明書が必要なサイトはありません。フォームで管理するサイトはすべて HTTPS を使っています。
certs.list.issue.site=サイト
certs.list.issue.siteHint=サイトの代表・追加ドメインがすべて 1 枚の証明書に入ります。ドメインがこのサーバーを向き、インターネットから 80 番ポートで到達できる必要があります。
certs.list.issue.submit=取得

