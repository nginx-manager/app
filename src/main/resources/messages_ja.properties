sites.field.type.PROXY=リバースプロキシ
sites.field.type.STATIC=静的ファイル
sites.field.type.hint=リバースプロキシは背後のアプリケーションサーバーへリクエストを転送し、静的ファイルはサーバー上のフォルダーのファイルをそのまま返します。
sites.field.staticRoot.hint=静的サイトで公開するフォルダーの絶対パスです。URL がフォルダーを指す場合は、その中の index.html を表示します。
sites.field.httpPort=HTTP ポート
sites.field.httpPort.hint=通常は 80 です。複数のサイトが同じポートを使ってもドメインで区別します。443、8081、9000 は使えません。
sites.field.httpsEnabled=HTTPS を使う（443）
sites.field.redirect=HTTP リクエストを HTTPS へ転送
sites.field.redirect.hint=オンにすると http:// へのリクエストを https:// へ恒久的にリダイレクト（301）します。証明書の発行確認パスは対象外です。
sites.field.certificate=証明書
sites.field.certificate.letsEncrypt=Let's Encrypt 自動発行
sites.field.certificate.uploaded={0}（アップロード）
sites.field.certificate.note=Let's Encrypt を選ぶと、適用後に証明書を取得して HTTPS 設定を自動で再適用します。証明書を取得するまでは HTTP のみで応答します。
sites.field.certificate.hint=ワイルドカードドメイン（*.example.com）は Let's Encrypt で取得できないため、証明書をアップロードしてください。
sites.field.saveDraft=下書きを保存
sites.proxy.target=プロキシ先（リバースプロキシ、複数なら 1 行に 1 つ）
sites.proxy.target.hint=リクエストを転送するバックエンドのアドレスです。例: http://127.0.0.1:8080。2 つ以上書くと、下の負荷分散方式で振り分けます。
sites.proxy.options=プロキシ詳細設定（WebSocket、タイムアウト、負荷分散）
sites.proxy.websocket=WebSocket 接続を転送
sites.proxy.websocket.hint=チャットやリアルタイム通知など WebSocket を使うアプリならオンにします。Upgrade ヘッダーをバックエンドへ渡します。
sites.proxy.connectTimeout=接続タイムアウト（秒、空欄なら 60）
sites.proxy.connectTimeout.hint=バックエンドとの接続が確立するまで待つ時間です。超えるとクライアントに 504 エラーを返します。
sites.proxy.readTimeout=応答タイムアウト（秒、空欄なら 60）
sites.proxy.readTimeout.note=WebSocket や時間のかかるリクエストでは、応答タイムアウトを長め（例: 3600）にしてください。この間バックエンドから何も送られないと接続を切ります。
sites.proxy.loadBalancing=バックエンドが複数あるときの振り分け方式
sites.proxy.loadBalancing.hint=プロキシ先が 2 つ以上のときだけ使われます。ログインセッションをサーバーのメモリに持つアプリなら、同じ IP を同じバックエンドへ送る方式を選んでください。
enum.LoadBalancing.ROUND_ROBIN=順番に（デフォルト）
enum.LoadBalancing.LEAST_CONN=接続数が最も少ないバックエンドへ
enum.LoadBalancing.IP_HASH=同じクライアント IP は同じバックエンドへ
