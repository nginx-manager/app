# --- site import (spec 005)
import.title=設定ファイルの取り込み
import.backToSites=サイト一覧
import.help=nginx の設定ファイルを読み込んでサイトとして登録します。フォームに移せるファイルはフォームサイト、それ以外はそのまま Raw サイトになり、ほかの変更と同じく適用画面で確認してから反映します。
import.bulk.done={0} 件のサイトを登録しました(適用待ち): {1}。
import.bulk.failed=登録できなかったファイル(プレビューで理由を確認してください): {0}
import.sources.title=取り込み場所
import.sources.help=パスパターンを登録しておくと、いつでも再検査して新しいファイルと元ファイルが変わったサイトを確認できます。* は 1 階層、** は任意の階層に一致します。
import.sources.remove=削除
import.sources.empty=登録した場所はありません。
import.sources.add=場所を登録
import.sources.scan=すべての場所を検査
import.pattern=パスパターン
import.pattern.hint=例: /home/*/nginx/*.conf、conf.d/*.conf(設定ルート基準)
import.roots=検索できるディレクトリ
import.roots.help=管理ツールのコンテナから見えるパスです。ホストのほかのディレクトリ(/home など)は、サーバーで sudo nm import-root add /home を実行して同じパスに接続します。
import.once.title=一度だけ検索
import.once.hint=登録せずにファイルのパスやパターンを検査します。
import.once.submit=検査
import.upload.title=PC のファイルをアップロード
import.upload.file=設定ファイル
import.upload.hint=1MB 以下の UTF-8 テキストファイル
import.upload.submit=アップロードしてプレビュー
import.scan.none=一致するファイルはありません。
import.scan.truncated=一致が多すぎるため先頭 200 件のみ表示します。パターンを絞ってください。
import.scan.denied=権限がなく開けなかった場所があります。管理ツールは UID 10101 で動くため、そのユーザーが読める必要があります。サーバーで次を実行してから、もう一度検査してください。
import.col.file=ファイル
import.col.domain=ドメイン
import.col.result=登録方法
import.mode.form=フォームサイト
import.mode.raw=Raw サイト
import.status.registered=登録済み
import.status.changed=元ファイル変更あり
import.status.taken=ドメイン重複
import.status.invalid=登録不可
import.preview=プレビュー
import.removeSource.bulk=設定ルート(/etc/nginx)内の元ファイルは削除する(サイトファイルへ移動)
import.bulk.help=選んだファイルはフォームに移せればフォームサイト、そうでなければ Raw サイトとして登録され、代表ドメインは最初の server_name です。変えるにはプレビューから 1 件ずつ登録してください。
import.bulk.submit=選んだファイルを登録
import.preview.title=取り込みプレビュー
