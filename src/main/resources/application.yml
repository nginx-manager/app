server:
  port: 9000
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax

nginx-manager:
  data-dir: /data
  acme:
    # 비워 두면 화면의 Let's Encrypt 설정(운영/스테이징)을 따른다. 시험용 ACME 서버를 쓸 때만 지정한다
    directory-url:
    webroot: /var/lib/nginx-manager/acme-webroot
    account-dir: ${nginx-manager.data-dir}/acme
  cert:
    # 갱신이 필요한 인증서를 찾는 주기
    check-interval: PT6H
  logs:
    # 이 크기를 넘은 nginx 로그를 .1, .2 …로 밀어내고 keep 개만 남긴다
    max-size-mb: 100
    keep: 5

spring:
  application:
    name: nginx-manager
  datasource:
    url: jdbc:sqlite:${nginx-manager.data-dir}/nginx-manager.db?journal_mode=WAL&foreign_keys=on&busy_timeout=5000
    hikari:
      # SQLite는 WAL 모드에서 읽기는 동시에, 쓰기는 하나씩 처리한다. 쓰기 경합은 busy_timeout으로 기다린다
      maximum-pool-size: 4
  jpa:
    open-in-view: false
    database-platform: org.hibernate.community.dialect.SQLiteDialect
    hibernate:
      # 스키마는 Flyway가 관리한다. SQLite는 타입 이름이 느슨해 Hibernate의 validate와 맞지 않는다
      ddl-auto: none
    properties:
      hibernate:
        default_batch_fetch_size: 100
  flyway:
    enabled: true
  thymeleaf:
    cache: true
  task:
    scheduling:
      pool:
        # 로그 실시간 보기가 느린 접속에 막혀도 인증서 갱신·감시 작업은 돌도록 스레드를 나눈다
        size: 4

nginx:
  runtime:
    binary: /usr/sbin/nginx
    config-root: /etc/nginx
    pid-file: /run/nginx/nginx.pid
    status-url: http://127.0.0.1:8081/nginx_status
    command-timeout: 30s
    # reload 뒤 nginx가 정상인지 확인하는 최대 시간. 넘기면 직전 설정으로 되돌린다
    health-timeout: 10s

management:
  health:
    # 메일 서버는 알림 채널을 쓸 때만 필요하다. 연결이 안 돼도 서비스 상태로 보지 않는다
    mail:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
