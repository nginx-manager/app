server:
  port: 9000
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax

nginx-manager:
  data-dir: /data
  acme:
    # 비워 두면 화면의 Let's Encrypt 설정(운영/스테이징)을 따른다. 시험용 ACME 서버를 쓸 때만 지정한다
    directory-url:
    webroot: /var/lib/nginx-manager/acme-webroot
    account-dir: ${nginx-manager.data-dir}/acme
  cert:
    # 갱신이 필요한 인증서를 찾는 주기
    check-interval: PT6H
  logs:
    # 이 크기를 넘은 nginx 로그를 .1, .2 …로 밀어내고 keep 개만 남긴다
    max-size-mb: 100
    keep: 5

spring:
  application:
    name: nginx-manager
  messages:
    # 화면 문구. messages.properties(한국어)가 기본이고 _en, _ja, _zh_CN이 번역이다
    basename: messages
    fallback-to-system-locale: false
  datasource:
    url: jdbc:sqlite:${nginx-manager.data-dir}/nginx-manager.db?journal_mode=WAL&foreign_keys=on&busy_timeout=5000&transaction_mode=IMMEDIATE
    hikari:
      # SQLite는 WAL 모드에서 읽기는 동시에, 쓰기는 하나씩 처리한다. 쓰기 경합은 busy_timeout으로 기다린다.
      # 트랜잭션은 처음부터 쓰기 잠금을 잡는다(IMMEDIATE). 읽고 나서 쓰는 트랜잭션은 그사이 다른 연결이 쓰면
      # 기다리지 않고 바로 SQLITE_BUSY로 실패한다(인증서 발급 실패 기록이 적용 기록과 겹칠 때 등)
      maximum-pool-size: 4
  jpa:
    open-in-view: false
    database-platform: org.hibernate.community.dialect.SQLiteDialect
    hibernate:
      # 스키마는 Flyway가 관리한다. SQLite는 타입 이름이 느슨해 Hibernate의 validate와 맞지 않는다
      ddl-auto: none
    properties:
      hibernate:
        default_batch_fetch_size: 100
  flyway:
    enabled: true
  thymeleaf:
    cache: true
  task:
    scheduling:
      pool:
        # 로그 실시간 보기가 느린 접속에 막혀도 인증서 갱신·감시 작업은 돌도록 스레드를 나눈다
        size: 4

nginx:
  runtime:
    # nginx 컨테이너와 같은 볼륨을 같은 경로에 둔다(설정, 로그)
    config-root: /etc/nginx
    log-dir: /var/log/nginx
    command-timeout: 30s
    # reload 뒤 nginx가 정상인지 확인하는 최대 시간. 넘기면 직전 설정으로 되돌린다
    health-timeout: 10s
    agent:
      # nginx 컨테이너 안의 에이전트. compose에서는 서비스 이름으로 찾는다
      url: http://nginx:7070
      # 토큰을 비우면 에이전트가 처음 뜰 때 공유 볼륨에 만들어 두는 파일에서 읽는다
      token:
      token-file: /var/lib/nginx-manager/agent/token

management:
  health:
    # 메일 서버는 알림 채널을 쓸 때만 필요하다. 연결이 안 돼도 서비스 상태로 보지 않는다
    mail:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      # /actuator/health/liveness: 관리도구 자체가 살아 있는지(컨테이너 HEALTHCHECK).
      # /actuator/health는 nginx 상태까지 본다
      probes:
        enabled: true
