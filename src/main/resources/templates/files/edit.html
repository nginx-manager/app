<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${file.path})}"></head>
<body>
<nav th:replace="~{fragments/layout :: nav}"></nav>
<main class="page">
    <h1 th:text="${file.path}">nginx.conf</h1>
    <p class="notice" th:if="${param.saved}">초안을 저장했습니다. <a th:href="@{/apply}">적용 화면</a>에서 반영하세요.</p>
    <p class="warning" th:if="${site != null and site.type.name() != 'RAW'}">
        폼으로 만든 사이트의 파일입니다. 여기서 저장하면 이 사이트는 원문 편집 전용으로 바뀌고, 폼으로 다시 고칠 수 없습니다.
    </p>
    <section class="card">
        <form th:action="@{/files/{id}(id=${file.id})}" method="post">
            <input type="hidden" name="version" th:value="${file.version}">
            <textarea name="content" class="editor" spellcheck="false" th:text="${content}"
                      th:readonly="${!currentUser.canEdit()}"></textarea>
            <button type="submit" th:if="${currentUser.canEdit()}">초안 저장</button>
        </form>
    </section>
</main>
</body>
</html>
