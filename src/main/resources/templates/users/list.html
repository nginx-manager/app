<!DOCTYPE html>
<html lang="ko" th:lang="${#locale.toLanguageTag()}" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(#{users.list.title})}"></head>
<body>
<nav th:replace="~{fragments/layout :: nav}"></nav>
<main class="page">
    <h1 th:text="#{users.list.title}">사용자</h1>

    <p class="notice" th:if="${param.invited}" th:text="#{users.list.invited(${param.invited[0]})}">계정을 만들었습니다.</p>
    <p class="notice" th:if="${param.saved}" th:text="#{users.list.saved}">저장했습니다. 바뀐 사용자는 다시 로그인해야 합니다.</p>
    <p class="error" th:if="${param.error != null and param.error[0] == 'last-admin'}" th:text="#{users.list.error.lastAdmin}">활성 관리자가 최소 한 명은 있어야 합니다.</p>
    <p class="error" th:if="${param.error != null and param.error[0] == 'password'}" th:text="#{users.list.error.password}">비밀번호는 10자 이상이어야 합니다.</p>

    <section class="card">
        <table>
            <thead>
            <tr><th th:text="#{users.list.col.username}">아이디</th><th th:text="#{users.list.col.role}">역할</th><th th:text="#{users.list.col.sites}">담당 사이트</th><th th:text="#{users.list.col.status}">상태</th><th th:text="#{users.list.col.created}">만든 날</th><th th:text="#{users.list.col.passwordReset}">비밀번호 재설정</th></tr>
            </thead>
            <tbody>
            <tr th:each="u : ${users}">
                <td>
                    <span th:text="${u.username}">admin</span>
                    <span class="muted small" th:if="${u.username == currentUser.username}" th:text="#{users.list.me}">(나)</span>
                </td>
                <td>
                    <form th:action="@{/users/{id}/role(id=${u.id})}" method="post" class="inline">
                        <input type="hidden" name="version" th:value="${u.version}">
                        <select name="role" th:aria-label="#{users.list.roleAria(${u.username})}" onchange="this.form.submit()">
                            <option th:each="r : ${roles}" th:value="${r}" th:text="#{|users.role.${r.name()}|}" th:selected="${r == u.role}">ADMIN</option>
                        </select>
                        <noscript><button type="submit" class="link" th:text="#{users.list.change}">변경</button></noscript>
                    </form>
                </td>
                <td th:with="count=${siteCounts.get(u.id)}">
                    <span th:if="${u.role.name() == 'ADMIN'}" class="muted" th:text="#{users.list.sitesAll}">전체</span>
                    <a th:unless="${u.role.name() == 'ADMIN'}" th:href="@{/sites(owner=${u.id})}" th:text="${count} ?: 0">2</a>
                </td>
                <td>
                    <span class="badge" th:classappend="${u.enabled ? 'ok' : 'bad'}" th:text="${u.enabled} ? #{users.list.active} : #{users.list.inactive}">활성</span>
                    <span class="badge warn" th:if="${u.lockedNow}" th:text="#{users.list.locked}" th:title="#{users.list.lockedHint}">잠김</span>
                    <span class="badge ok" th:if="${u.totpEnabled}" th:text="#{users.list.twoFactor}" th:title="#{users.list.twoFactorHint}">2단계 인증</span>
                    <form th:if="${u.totpEnabled and u.username != currentUser.username}" th:action="@{/users/{id}/2fa/reset(id=${u.id})}" method="post" class="inline">
                        <input type="hidden" name="version" th:value="${u.version}">
                        <button type="submit" class="link" th:text="#{users.list.twoFactorReset}" th:title="#{users.list.twoFactorResetHint}">2단계 인증 해제</button>
                    </form>
                    <form th:unless="${u.username == currentUser.username}" th:action="@{/users/{id}/enabled(id=${u.id})}" method="post" class="inline">
                        <input type="hidden" name="version" th:value="${u.version}">
                        <input type="hidden" name="enabled" th:value="${!u.enabled}">
                        <button type="submit" class="link" th:text="${u.enabled} ? #{users.list.deactivate} : #{users.list.activate}">비활성화</button>
                    </form>
                </td>
                <td class="nowrap" th:text="${#temporals.format(u.createdAt, 'yyyy-MM-dd')}">2026-10-13</td>
                <td>
                    <form th:action="@{/users/{id}/password(id=${u.id})}" method="post" class="inline">
                        <input type="hidden" name="version" th:value="${u.version}">
                        <input type="password" name="password" minlength="10" autocomplete="new-password"
                               th:aria-label="#{users.list.newPasswordAria(${u.username})}" th:placeholder="#{users.list.newPassword}" placeholder="새 비밀번호">
                        <button type="submit" class="link" th:text="#{users.list.reset}">재설정</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
        <p class="hint" th:text="#{users.list.tableHint}">역할을 바꾸거나 비밀번호를 재설정하면 그 사용자는 로그아웃되고 다시 로그인해야 합니다. 재설정한 비밀번호는 본인에게 직접 전해 주세요.</p>
    </section>

    <section class="card">
        <h2 th:text="#{users.list.add.title}">사용자 추가</h2>
        <form th:action="@{/users}" th:object="${invite}" method="post" class="row-form">
            <label><span th:text="#{users.list.add.username}">아이디</span> <input type="text" th:field="*{username}" required></label>
            <p class="error" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></p>
            <label><span th:text="#{users.list.add.password}">초기 비밀번호</span> <input type="password" th:field="*{password}" minlength="10" autocomplete="new-password" required>
                <span class="hint" th:text="#{users.list.add.passwordHint}">10자 이상. 본인이 로그인한 뒤 내 계정에서 바꿀 수 있습니다.</span></label>
            <p class="error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></p>
            <label><span th:text="#{users.list.add.role}">역할</span>
                <select th:field="*{role}">
                    <option value="MEMBER" th:text="#{users.list.add.roleMember}">MEMBER: 담당 사이트만</option>
                    <option value="ADMIN" th:text="#{users.list.add.roleAdmin}">ADMIN: 사용자·설정 관리까지</option>
                </select>
            </label>
            <button type="submit" th:text="#{users.list.add.submit}">추가</button>
        </form>
        <dl class="hint">
            <dt th:text="#{users.role.MEMBER}">멤버</dt><dd th:text="#{users.list.roleHelp.MEMBER}">…</dd>
            <dt th:text="#{users.role.ADMIN}">관리자</dt><dd th:text="#{users.list.roleHelp.ADMIN}">…</dd>
        </dl>
    </section>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
