<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('대시보드')}"></head>
<body>
<nav th:replace="~{fragments/layout :: nav}"></nav>
<main class="page">
    <h1>대시보드</h1>
    <p class="notice" th:if="${notice}" th:text="${notice}">완료</p>
    <pre class="error code" th:if="${error}" th:text="${error}">오류</pre>

    <section class="card warn-card" id="cert-warnings" th:unless="${#lists.isEmpty(dashboard.certificateWarnings)}">
        <h2>인증서 확인 필요</h2>
        <ul>
            <li th:each="w : ${dashboard.certificateWarnings}">
                <a th:href="@{/certs#cert-{id}(id=${w.id})}" th:text="${w.name}">app.local</a>
                <span th:if="${w.failing}" class="badge bad">발급·갱신 실패</span>
                <span th:if="${w.notAfter != null}" class="badge warn" th:text="${w.daysLeft} + '일 뒤 만료'">10일 뒤 만료</span>
                <span class="small error" th:if="${w.failing}" th:text="${w.lastError}"></span>
            </li>
        </ul>
    </section>

    <div class="columns">
        <section class="card">
            <h2>nginx</h2>
            <dl class="facts">
                <dt>상태</dt>
                <dd>
                    <span th:if="${status.state.name() == 'RUNNING'}" class="badge ok">실행 중</span>
                    <span th:unless="${status.state.name() == 'RUNNING'}" class="badge bad">중지됨</span>
                    <form th:if="${status.state.name() != 'RUNNING' and currentUser.isAdmin()}"
                          th:action="@{/runtime/start}" method="post" class="inline">
                        <button type="submit">nginx 시작</button>
                    </form>
                </dd>
                <dt>버전</dt>
                <dd th:text="${status.version} ?: '알 수 없음'">1.31.6</dd>
                <dt>마스터 PID</dt>
                <dd th:text="${status.masterPid} ?: '-'">1</dd>
                <dt>사이트</dt>
                <dd><a th:href="@{/sites}" th:text="${dashboard.enabledSiteCount} + ' 활성 / ' + ${dashboard.siteCount} + ' 전체'">3 / 4</a></dd>
                <dt>DB 크기</dt>
                <dd th:text="${#numbers.formatDecimal(dashboard.databaseBytes / 1048576.0, 1, 1)} + ' MB'">1.2 MB</dd>
            </dl>
        </section>
        <section class="card">
            <div class="title-row">
                <h2>최근 적용</h2>
                <a th:href="@{/versions}">전체 이력</a>
            </div>
            <p class="muted" th:if="${#lists.isEmpty(dashboard.recentVersions)}">아직 기록이 없습니다.</p>
            <table th:unless="${#lists.isEmpty(dashboard.recentVersions)}" id="recent-versions">
                <tbody>
                <tr th:each="v : ${dashboard.recentVersions}">
                    <td><a th:href="@{/versions/{id}(id=${v.id})}" th:text="'#' + ${v.id}">#3</a></td>
                    <td class="nowrap small" th:text="${#temporals.format(v.createdAt, 'MM-dd HH:mm')}">10-13 10:00</td>
                    <td th:text="${v.source.label()}">적용</td>
                    <td><span class="badge" th:classappend="${v.result.name() == 'SUCCESS' ? 'ok' : 'bad'}"
                              th:text="${v.result.label()}">적용됨</span></td>
                    <td class="small" th:text="${v.authorName ?: '시스템'}">admin</td>
                </tr>
                </tbody>
            </table>
        </section>
    </div>
    <section class="card">
        <h2>설치된 모듈 <small th:text="${#lists.size(status.modules)}">0</small></h2>
        <ul class="tags">
            <li th:each="m : ${status.modules}" th:text="${m.dynamic} ? ${m.name} + ' (동적)' : ${m.name}">http_ssl_module</li>
        </ul>
    </section>
</main>
</body>
</html>
