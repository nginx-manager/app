<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title} + ' · nginx manager'">nginx manager</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <script th:src="@{/webjars/htmx.org/2.0.5/dist/htmx.min.js}" defer></script>
</head>
<body>
<th:block th:fragment="nav">
<nav class="nav">
    <a class="brand" th:href="@{/}">nginx manager</a>
    <a th:href="@{/}">대시보드</a>
    <a th:href="@{/sites}">사이트</a>
    <a th:href="@{/files}">설정 파일</a>
    <a th:href="@{/versions}">이력</a>
    <a th:if="${currentUser != null and currentUser.canEdit()}" th:href="@{/apply}">적용<span class="count" th:if="${pendingCount > 0}" th:text="${pendingCount}">2</span></a>
    <a th:if="${currentUser != null and currentUser.isAdmin()}" th:href="@{/users}">사용자</a>
    <a th:if="${currentUser != null and currentUser.isAdmin()}" th:href="@{/audit}">감사 로그</a>
    <span class="spacer"></span>
    <a class="who" th:if="${currentUser}" th:href="@{/account}" th:text="${currentUser.username}">admin</a>
    <form th:if="${currentUser}" th:action="@{/logout}" method="post" class="inline">
        <button type="submit" class="link">로그아웃</button>
    </form>
</nav>
<div class="drift-banner" th:if="${drift != null and !#lists.isEmpty(drift)}">
    서버에서 직접 바뀐 설정 파일이 <strong th:text="${#lists.size(drift)}">1</strong>개 있습니다.
    <a th:href="@{/versions#drift}">확인하기</a>
</div>
</th:block>
</body>
</html>
