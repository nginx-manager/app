<!DOCTYPE html>
<html lang="ko" th:lang="${#locale.toLanguageTag()}" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(#{account.pageTitle})}"></head>
<body>
<nav th:replace="~{fragments/layout :: nav}"></nav>
<main class="page">
    <h1 th:text="#{account.title}">비밀번호 변경</h1>
    <section class="card narrow">
        <p class="notice" th:if="${param.saved}" th:text="#{account.saved}">비밀번호를 바꿨습니다.</p>
        <form th:action="@{/account}" th:object="${form}" method="post">
            <label><span th:text="#{account.currentPassword}">현재 비밀번호</span> <input type="password" th:field="*{currentPassword}" autocomplete="current-password" required></label>
            <p class="error" th:if="${#fields.hasErrors('currentPassword')}" th:errors="*{currentPassword}"></p>
            <label><span th:text="#{account.newPassword}">새 비밀번호</span> <input type="password" th:field="*{newPassword}" minlength="10" autocomplete="new-password" required>
                <span class="hint" th:text="#{account.newPasswordHint}">10자 이상. 여러 단어를 이은 긴 문장이 외우기 쉽고 안전합니다.</span></label>
            <p class="error" th:if="${#fields.hasErrors('newPassword')}" th:errors="*{newPassword}"></p>
            <label><span th:text="#{account.newPasswordConfirm}">새 비밀번호 확인</span> <input type="password" th:field="*{newPasswordConfirm}" autocomplete="new-password" required></label>
            <p class="error" th:if="${#fields.hasErrors('confirmed')}" th:errors="*{confirmed}"></p>
            <button type="submit" th:text="#{account.submit}">변경</button>
        </form>
    </section>

    <section class="card narrow" id="two-factor" th:if="${me != null}">
        <h2 th:text="#{account.2fa.heading}">2단계 인증</h2>
        <p class="notice" th:if="${param['2fa-off']}" th:text="#{account.2fa.off}">2단계 인증을 껐습니다.</p>
        <p class="error" th:if="${param['2fa-error']}" th:text="#{msg.account.wrongPassword}">현재 비밀번호가 맞지 않습니다.</p>
        <th:block th:unless="${me.totpEnabled}">
            <p><span class="badge" th:text="#{account.2fa.statusOff}">꺼짐</span>
                <span th:text="#{account.2fa.intro}">로그인할 때 비밀번호와 함께 휴대폰 인증 앱의 코드를 넣게 합니다. 관리 화면을 인터넷에 열어 두었다면 켜 두세요.</span></p>
            <a th:href="@{/account/2fa}" class="button" th:text="#{account.2fa.start}">켜기</a>
        </th:block>
        <th:block th:if="${me.totpEnabled}">
            <p><span class="badge ok" th:text="#{account.2fa.statusOn}">켜짐</span>
                <span th:text="#{account.2fa.codesLeft(${me.recoveryCodesLeft})}">남은 복구 코드 10개</span></p>
            <form th:action="@{/account/2fa/recovery-codes}" method="post" class="row-form">
                <label><span th:text="#{account.currentPassword}">현재 비밀번호</span> <input type="password" name="currentPassword" autocomplete="current-password" required></label>
                <button type="submit" class="secondary" th:text="#{account.2fa.regenerate}">복구 코드 새로 만들기</button>
            </form>
            <form th:action="@{/account/2fa/disable}" method="post" class="row-form">
                <label><span th:text="#{account.currentPassword}">현재 비밀번호</span> <input type="password" name="currentPassword" autocomplete="current-password" required></label>
                <button type="submit" class="secondary danger" th:text="#{account.2fa.disable}">끄기</button>
            </form>
        </th:block>
    </section>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
