<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('인증서')}"></head>
<body>
<nav th:replace="~{fragments/layout :: nav}"></nav>
<main class="page">
    <div class="title-row">
        <h1>인증서</h1>
        <a th:if="${currentUser.isAdmin()}" th:href="@{/settings/acme}">Let's Encrypt 설정</a>
        <a th:if="${currentUser.isAdmin()}" th:href="@{/settings/notifications}">알림 설정</a>
    </div>
    <p class="notice" th:if="${notice}" th:text="${notice}">완료</p>
    <p class="error" th:if="${error}" th:text="${error}">오류</p>

    <section class="card">
        <p class="muted" th:if="${#lists.isEmpty(certificates)}">
            아직 인증서가 없습니다. 사이트 화면에서 HTTPS를 켜면 Let's Encrypt 인증서를 자동으로 받습니다.
        </p>
        <table th:unless="${#lists.isEmpty(certificates)}" id="certificates">
            <thead>
            <tr><th>이름</th><th>도메인</th><th>출처</th><th>상태</th><th>만료</th><th>다음 갱신</th><th>사용 사이트</th><th></th></tr>
            </thead>
            <tbody>
            <tr th:each="c : ${certificates}" th:id="'cert-' + ${c.id}">
                <td th:text="${c.name}">app.local</td>
                <td class="small" th:text="${c.domains}">app.local</td>
                <td><span th:if="${c.source.name() == 'LETS_ENCRYPT'}">Let's Encrypt</span><span th:unless="${c.source.name() == 'LETS_ENCRYPT'}">업로드</span></td>
                <td>
                    <span th:if="${#lists.contains(running, c.id)}" class="badge warn">발급 중</span>
                    <span th:if="${c.status.name() == 'PENDING' and !#lists.contains(running, c.id)}" class="badge">대기</span>
                    <span th:if="${c.status.name() == 'ACTIVE' and !c.isExpiringSoon(now)}" class="badge ok">정상</span>
                    <span th:if="${c.status.name() == 'ACTIVE' and c.isExpiringSoon(now)}" class="badge warn"
                          th:text="${c.daysLeft(now)} + '일 남음'">10일 남음</span>
                    <span th:if="${c.isFailing()}" class="badge bad" th:title="${c.lastError}"
                          th:text="'실패 ' + ${c.failureCount} + '회'">실패</span>
                    <div class="small error" th:if="${c.isFailing()}" th:text="${c.lastError}"></div>
                </td>
                <td class="nowrap" th:text="${c.notAfter != null} ? ${#temporals.format(c.notAfter, 'yyyy-MM-dd')} : '-'">2026-12-01</td>
                <td class="nowrap" th:text="${c.autoRenew and c.nextRenewalAt != null} ? ${#temporals.format(c.nextRenewalAt, 'yyyy-MM-dd HH:mm')} : '-'">-</td>
                <td class="small">
                    <span th:each="d, s : ${sitesByCert.get(c.id)}" th:text="${d} + (${s.last} ? '' : ', ')">app.local</span>
                </td>
                <td>
                    <form th:if="${currentUser.canEdit() and c.source.name() == 'LETS_ENCRYPT'}"
                          th:action="@{/certs/{id}/renew(id=${c.id})}" method="post" class="inline">
                        <button type="submit" class="link" th:text="${c.status.name() == 'ACTIVE'} ? '지금 갱신' : '다시 시도'">지금 갱신</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </section>

    <section class="card" th:if="${currentUser.canEdit()}">
        <h2>인증서 업로드</h2>
        <p class="muted small">와일드카드 인증서나 사내 CA 인증서처럼 직접 받은 인증서를 올립니다. 같은 이름으로 올리면 교체합니다.</p>
        <form th:action="@{/certs/upload}" method="post" enctype="multipart/form-data" class="row-form">
            <label>이름 <input type="text" name="name" required pattern="[A-Za-z0-9._*-]+" maxlength="200"></label>
            <label>인증서 체인 (PEM) <input type="file" name="certificate" required></label>
            <label>개인 키 (PEM) <input type="file" name="privateKey" required></label>
            <button type="submit">올리기</button>
        </form>
    </section>
</main>
</body>
</html>
