<!DOCTYPE html>
<html lang="ko" th:lang="${#locale.toLanguageTag()}" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(#{login.title})}"></head>
<body class="auth">
<div th:replace="~{fragments/layout :: authTop}"></div>
<main class="auth-shell">
    <aside th:replace="~{fragments/layout :: authBrand}"></aside>
    <section class="auth-form">
        <h1 th:text="#{login.title}">로그인</h1>
        <p class="auth-sub" th:text="#{login.subtitle}">계정 정보를 입력해 주세요.</p>
        <p class="notice" th:if="${param.setup}" th:text="#{login.setupDone}">관리자 계정을 만들었습니다. 로그인해 주세요.</p>
        <p class="notice" th:if="${param.logout}" th:text="#{login.loggedOut}">로그아웃했습니다.</p>
        <p class="notice" th:if="${param.expired}" th:text="#{login.expired}">계정 정보가 바뀌어 로그아웃됐습니다. 다시 로그인해 주세요.</p>
        <p class="error" role="alert" th:if="${param.error}" th:text="#{login.error}">아이디나 비밀번호가 맞지 않거나, 계정이 잠겨 있습니다.</p>
        <form th:action="@{/login}" method="post">
            <label><span th:text="#{login.username}">아이디</span>
                <span class="field"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg><input type="text" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" required autofocus></span>
            </label>
            <label><span th:text="#{login.password}">비밀번호</span>
                <span class="field"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg><input type="password" name="password" autocomplete="current-password" required><button type="button" class="link reveal" aria-pressed="false" th:attr="aria-label=#{login.showPassword},data-show=#{login.showPassword},data-hide=#{login.hidePassword}" th:title="#{login.showPassword}"><svg class="icon icon-eye" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg><svg class="icon icon-eye-off" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 3l18 18M10.6 5.1A10 10 0 0 1 12 5c6.5 0 10 7 10 7a17 17 0 0 1-3.2 4.1M6.6 6.6A17 17 0 0 0 2 12s3.5 7 10 7a9.7 9.7 0 0 0 5.4-1.6M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg></button></span>
                <span class="caps-warning" aria-live="polite" hidden th:text="#{login.capsLock}">Caps Lock이 켜져 있습니다.</span>
            </label>
            <button type="submit" th:text="#{login.submit}">로그인</button>
        </form>
        <p class="hint auth-hint"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l8 3v6c0 4.5-3.4 8.3-8 9-4.6-.7-8-4.5-8-9V6z"/></svg><span th:text="#{login.hint}">5번 연속 틀리면 계정이 10분 동안 잠깁니다. 비밀번호를 잊었다면 관리자에게 재설정을 요청하세요.</span></p>
    </section>
</main>
</body>
</html>
