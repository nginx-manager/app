<!DOCTYPE html>
<html lang="ko" th:lang="${#locale.toLanguageTag()}" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(#{login.title})}"></head>
<body class="centered">
<div th:replace="~{fragments/layout :: langs}"></div>
<main class="card narrow">
    <h1>nginx manager</h1>
    <p class="notice" th:if="${param.setup}" th:text="#{login.setupDone}">관리자 계정을 만들었습니다. 로그인해 주세요.</p>
    <p class="notice" th:if="${param.logout}" th:text="#{login.loggedOut}">로그아웃했습니다.</p>
    <p class="notice" th:if="${param.expired}" th:text="#{login.expired}">계정 정보가 바뀌어 로그아웃됐습니다. 다시 로그인해 주세요.</p>
    <p class="error" th:if="${param.error}" th:text="#{login.error}">아이디나 비밀번호가 맞지 않거나, 계정이 잠겨 있습니다.</p>
    <form th:action="@{/login}" method="post">
        <label><span th:text="#{login.username}">아이디</span> <input type="text" name="username" autocomplete="username" required autofocus></label>
        <label><span th:text="#{login.password}">비밀번호</span> <input type="password" name="password" autocomplete="current-password" required></label>
        <button type="submit" th:text="#{login.submit}">로그인</button>
    </form>
    <p class="hint" th:text="#{login.hint}">5번 연속 틀리면 계정이 10분 동안 잠깁니다. 비밀번호를 잊었다면 관리자에게 재설정을 요청하세요.</p>
</main>
</body>
</html>
