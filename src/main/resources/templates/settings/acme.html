<!DOCTYPE html>
<html lang="ko" th:lang="${#locale.toLanguageTag()}" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(#{settings.acme.pageTitle})}"></head>
<body>
<nav th:replace="~{fragments/layout :: nav}"></nav>
<main class="page">
    <h1 th:text="#{settings.acme.title}">Let's Encrypt 설정</h1>
    <p class="notice" th:if="${notice}" th:text="${notice}">저장</p>
    <p class="error" th:if="${error}" th:text="${error}">오류</p>
    <p class="notice" th:if="${overrideDirectory}">
        <span th:text="#{settings.acme.override.before}">서버 설정으로 ACME 주소가</span> <code th:text="${overrideDirectory}">acme://</code><span th:text="#{settings.acme.override.after}">로 고정되어 있어 아래 환경 선택보다 우선합니다.</span>
    </p>
    <section class="card">
        <form th:action="@{/settings/acme}" method="post" class="row-form">
            <fieldset>
                <legend th:text="#{settings.acme.environment}">환경</legend>
                <label class="inline"><input type="radio" name="environment" value="PRODUCTION"
                       th:checked="${settings.environment.name() == 'PRODUCTION'}"> <span th:text="#{settings.acme.production}">운영 (실제 인증서)</span></label>
                <label class="inline"><input type="radio" name="environment" value="STAGING"
                       th:checked="${settings.environment.name() == 'STAGING'}"> <span th:text="#{settings.acme.staging}">스테이징 (시험용, 브라우저가 신뢰하지 않음)</span></label>
                <p class="hint" th:text="#{settings.acme.environmentHint}">처음 설정할 때는 스테이징으로 발급이 되는지 확인한 뒤 운영으로 바꾸세요. 운영 환경은 같은 도메인의 발급 횟수 제한이 엄격합니다.</p>
            </fieldset>
            <label><span th:text="#{settings.acme.contactEmail}">연락용 메일 (선택, 만료 안내를 Let's Encrypt에서 받음)</span>
                <input type="email" name="contactEmail" th:value="${settings.contactEmail}" maxlength="200">
                <span class="hint" th:text="#{settings.acme.contactEmailHint}">ACME 계정에 등록되는 주소입니다. 비워 두어도 발급에는 문제가 없습니다.</span>
            </label>
            <button type="submit" th:text="#{settings.acme.save}">저장</button>
        </form>
        <p class="muted small" th:text="#{settings.acme.http01}">HTTP-01 방식으로 인증하므로 도메인이 이 서버의 80번 포트로 들어와야 합니다.</p>
    </section>
</main>
</body>
</html>
