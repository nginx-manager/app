<!DOCTYPE html>
<html lang="ko" th:lang="${#locale.toLanguageTag()}" xmlns:th="http://www.thymeleaf.org">
<body>
<!--
  사이트 추가·수정 폼이 함께 쓰는 HTTPS 항목. th:object 안에서 넣는다.
  고른 방식에 따라 필요한 항목만 보인다(CSS :has, 스크립트 없음). 지원하지 않는 브라우저에서는 모두 보일 뿐 동작은 같다.
-->
<th:block th:fragment="fields(editable)">
    <fieldset class="https-choice">
        <legend>HTTPS</legend>
        <p class="hint" th:text="#{sites.https.intro}">HTTPS를 쓸지, 인증서를 어떻게 마련할지 고릅니다.</p>
        <label class="choice">
            <input type="radio" th:field="*{certificateMode}" value="NONE" th:disabled="${!editable}">
            <span><th:block th:text="#{sites.https.mode.NONE}">사용 안 함 (HTTP만)</th:block>
                <span class="hint" th:text="#{sites.https.mode.NONE.hint}">설명</span></span>
        </label>
        <label class="choice">
            <input type="radio" th:field="*{certificateMode}" value="LETS_ENCRYPT" th:disabled="${!editable}">
            <span><th:block th:text="#{sites.https.mode.LETS_ENCRYPT}">Let's Encrypt 인증서 발급</th:block>
                <span class="hint" th:text="#{sites.https.mode.LETS_ENCRYPT.hint}">설명</span></span>
        </label>
        <label class="choice">
            <input type="radio" th:field="*{certificateMode}" value="UPLOADED"
                   th:disabled="${!editable or (#lists.isEmpty(uploadedCertificates) and form?.certificateMode()?.name() != 'UPLOADED')}">
            <span><th:block th:text="#{sites.https.mode.UPLOADED}">업로드한 인증서 사용</th:block>
                <span class="hint" th:text="#{sites.https.mode.UPLOADED.hint}">설명</span>
                <span class="hint" th:if="${#lists.isEmpty(uploadedCertificates)}">
                    <th:block th:text="#{sites.https.mode.UPLOADED.none}">아직 올린 인증서가 없습니다.</th:block>
                    <a th:href="@{/certs}" th:text="#{sites.https.mode.UPLOADED.link}">인증서 화면에서 올리기</a></span></span>
        </label>
        <span class="error" th:errors="*{letsEncryptDomainsValid}"></span>
        <div class="https-uploaded">
            <label><th:block th:text="#{sites.field.certificate}">인증서</th:block>
                <select th:field="*{certificateId}" th:disabled="${!editable}">
                    <option value="" th:text="#{sites.https.chooseCertificate}">인증서를 고르세요</option>
                    <option th:each="c : ${uploadedCertificates}" th:value="${c.id}" th:text="#{sites.field.certificate.uploaded(${c.name})}">wildcard</option>
                </select>
            </label>
            <span class="error" th:errors="*{uploadedCertificateChosen}"></span>
        </div>
        <div class="https-on">
            <label class="inline"><input type="checkbox" th:field="*{redirectHttpToHttps}" th:disabled="${!editable}"> <th:block th:text="#{sites.field.redirect}">HTTP 요청을 HTTPS로 넘기기</th:block></label>
            <p class="hint" th:text="#{sites.field.redirect.hint}">켜면 http:// 로 들어온 요청을 https:// 주소로 301 리디렉션합니다.</p>
        </div>
    </fieldset>
</th:block>
</body>
</html>
