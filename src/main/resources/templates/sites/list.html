<!DOCTYPE html>
<html lang="ko" th:lang="${#locale.toLanguageTag()}" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(#{sites.list.title})}"></head>
<body>
<nav th:replace="~{fragments/layout :: nav}"></nav>
<main class="page">
    <div class="title-row">
        <h1 th:text="#{sites.list.title}">사이트</h1>
        <a class="button secondary" th:if="${currentUser.canEdit()}" th:href="@{/sites/import}" th:text="#{import.title}">설정 파일 가져오기</a>
        <a class="button" th:if="${currentUser.canEdit()}" th:href="@{/sites/new}" th:text="#{sites.list.add}">사이트 추가</a>
    </div>
    <section class="card">
        <p th:if="${#lists.isEmpty(sites)}" class="muted" th:text="#{sites.list.empty}">등록된 사이트가 없습니다.</p>
        <table th:unless="${#lists.isEmpty(sites)}">
            <thead>
            <tr><th th:text="#{sites.list.col.domain}">도메인</th><th th:text="#{sites.list.col.type}">유형</th><th th:text="#{sites.list.col.target}">대상</th><th th:text="#{sites.list.col.port}">포트</th><th th:text="#{sites.list.col.status}">상태</th></tr>
            </thead>
            <tbody>
            <tr th:each="s : ${sites}">
                <td>
                    <a th:href="@{/sites/{id}(id=${s.id})}" th:text="${s.primaryDomain}">app.local</a>
                    <div class="muted small" th:if="${s.extraDomains}" th:text="${s.extraDomains}">www.app.local</div>
                </td>
                <td th:switch="${s.type.name()}">
                    <span th:case="'STATIC'" th:text="#{sites.list.type.STATIC}">정적</span>
                    <span th:case="'PROXY'" th:text="#{sites.list.type.PROXY}">프록시</span>
                    <span th:case="'REDIRECT'" th:text="#{sites.list.type.REDIRECT}">리디렉션</span>
                    <span th:case="*" th:text="#{sites.list.type.RAW}">원문 편집</span>
                </td>
                <td class="targets">
                    <code th:each="t : ${s.targets()}" th:text="${t}">http://127.0.0.1:8080</code>
                </td>
                <td>
                    <span th:text="${s.listenHttpPort}">80</span>
                    <span th:if="${s.httpsEnabled}" class="badge">HTTPS</span>
                </td>
                <td class="badges">
                    <span th:if="${s.enabled}" class="badge ok" th:text="#{sites.status.enabled}">활성</span>
                    <span th:unless="${s.enabled}" class="badge" th:text="#{sites.status.disabled}">비활성</span>
                    <span th:if="${s.pending}" class="badge warn" th:text="#{sites.status.pending}">적용 대기</span>
                </td>
            </tr>
            </tbody>
        </table>
    </section>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
