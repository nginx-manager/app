<!DOCTYPE html>
<html lang="ko" th:lang="${#locale.toLanguageTag()}" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(#{versions.diff.title})}"></head>
<body>
<nav th:replace="~{fragments/layout :: nav}"></nav>
<main class="page">
    <h1>
        <a th:href="@{/versions/{id}(id=${from.id})}" th:text="'#' + ${from.id}">#1</a>
        →
        <a th:href="@{/versions/{id}(id=${to.id})}" th:text="'#' + ${to.id}">#3</a>
    </h1>
    <p class="hint" th:text="#{versions.diff.help}">왼쪽 버전에서 오른쪽 버전으로 바뀐 내용입니다. - 줄은 빠진 내용, + 줄은 더해진 내용입니다.</p>
    <p class="muted" th:if="${!from.snapshot or !to.snapshot}" th:text="#{versions.diff.partial}">
        실패한 버전은 적용하려던 파일만 담고 있어, 그 파일들만 비교합니다.
    </p>
    <section class="card">
        <p th:if="${#lists.isEmpty(diffs)}" class="muted" th:text="#{versions.diff.same}">두 버전의 설정이 같습니다.</p>
        <div th:each="d : ${diffs}" class="pending">
            <div class="title-row">
                <code th:text="${d.path}">nginx.conf</code>
                <span class="badge warn" th:text="#{|versions.diff.change.${d.change.name()}|}">수정</span>
            </div>
            <pre class="code diff" th:text="${d.diff}"></pre>
        </div>
    </section>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
