<!DOCTYPE html>
<html lang="ko" th:lang="${#locale.toLanguageTag()}" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(#{logs.view.pageTitle(${site.primaryDomain})})}"></head>
<body>
<nav th:replace="~{fragments/layout :: nav}"></nav>
<main class="page">
    <div class="title-row">
        <h1><th:block th:text="#{logs.view.titleBefore}"></th:block><a th:href="@{/sites/{id}(id=${site.id})}" th:text="${site.primaryDomain}">app.local</a> <th:block th:text="#{logs.view.titleAfter}">로그</th:block></h1>
        <a th:href="@{/logs/{id}(id=${site.id},type='ACCESS')}" th:classappend="${type.name() == 'ACCESS'} ? 'current'">access</a>
        <a th:href="@{/logs/{id}(id=${site.id},type='ERROR')}" th:classappend="${type.name() == 'ERROR'} ? 'current'">error</a>
    </div>

    <section class="card">
        <form th:action="@{/logs/{id}(id=${site.id})}" method="get" class="row-form">
            <input type="hidden" name="type" th:value="${type}">
            <label><th:block th:text="#{logs.view.search}">찾을 말</th:block> <input type="search" name="q" th:value="${q}" placeholder="예: 502, /api, upstream" th:placeholder="#{logs.view.search.placeholder}" maxlength="200"></label>
            <button type="submit" th:text="#{logs.view.search.submit}">검색</button>
            <button type="button" class="secondary" id="live-toggle"
                    th:attr="data-stream=@{/logs/{id}/stream(id=${site.id},type=${type})}"
                    th:data-label-start="#{logs.view.live.start}" th:data-label-stop="#{logs.view.live.stop}"
                    th:data-state-connecting="#{logs.view.live.connecting}" th:data-state-watching="#{logs.view.live.watching}"
                    th:data-state-reconnecting="#{logs.view.live.reconnecting}" th:data-state-stopped="#{logs.view.live.stopped}"
                    th:text="#{logs.view.live.start}">실시간 보기</button>
        </form>
        <p class="hint" th:text="#{logs.view.search.hint}">입력한 글자가 들어간 줄만 보여 줍니다.</p>
        <p class="muted small" th:if="${result.missing}" th:text="#{logs.view.missing}">로그 파일이 아직 없습니다. 이 사이트로 요청이 들어오면 생깁니다.</p>
        <p class="muted small" th:unless="${result.missing}">
            <span th:text="#{logs.view.lineCount(${'' + #lists.size(result.lines)})}">0줄</span>
            <span th:if="${#lists.size(result.lines) >= limit}" th:text="#{logs.view.limited(${'' + limit})}"></span>
            <span th:if="${result.exhausted}" th:text="#{logs.view.exhausted}">· 파일 끝부분만 찾았습니다</span>
            <th:block th:text="#{logs.view.newestFirst}">· 최근 줄이 위에 있습니다</th:block>
        </p>
        <pre class="code log-lines" id="search-lines"><th:block th:each="l : ${result.lines}">[[${l}]]
</th:block></pre>
    </section>

    <section class="card" id="live" hidden>
        <div class="title-row">
            <h2 th:text="#{logs.view.live.title}">실시간</h2>
            <span class="badge ok" id="live-state" th:text="#{logs.view.live.connecting}">연결 중</span>
        </div>
        <pre class="code log-lines" id="live-lines"></pre>
    </section>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
<script th:src="@{/js/log-tail.js}" defer></script>
</body>
</html>
