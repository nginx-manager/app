<!DOCTYPE html>
<html lang="ko" th:lang="${#locale.toLanguageTag()}" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(#{streams.list.title})}"></head>
<body>
<nav th:replace="~{fragments/layout :: nav}"></nav>
<main class="page">
    <div class="title-row">
        <h1 th:text="#{streams.list.title}">스트림</h1>
        <a class="button" th:if="${currentUser.canEdit()}" th:href="@{/streams/new}" th:text="#{streams.list.add}">스트림 추가</a>
    </div>
    <p class="hint" th:text="#{streams.list.help}">설명</p>
    <p class="notice" th:if="${param.deleted}"><th:block th:text="#{streams.list.deleted.before}">지우는 초안을 만들었습니다.</th:block> <a th:href="@{/apply}" th:text="#{sites.detail.saved.link}">적용 화면</a><th:block th:text="#{sites.detail.saved.after}">에서 반영하세요.</th:block></p>
    <section class="card">
        <p th:if="${#lists.isEmpty(streams)}" class="muted" th:text="#{streams.list.empty}">등록된 스트림이 없습니다.</p>
        <table th:unless="${#lists.isEmpty(streams)}">
            <thead>
            <tr><th th:text="#{streams.list.col.listen}">받는 포트</th><th th:text="#{streams.list.col.backends}">백엔드</th><th th:text="#{streams.list.col.note}">메모</th><th th:text="#{sites.list.col.status}">상태</th></tr>
            </thead>
            <tbody>
            <tr th:each="row : ${streams}">
                <td><a th:href="@{/streams/{id}(id=${row.stream.id})}" th:text="|${row.stream.protocol} ${row.stream.listenPort}|">TCP 5432</a></td>
                <td>
                    <span th:if="${row.stream.raw}" class="badge" th:text="#{streams.badge.raw}">원문 편집</span>
                    <th:block th:unless="${row.stream.raw}" th:text="${#strings.listJoin(row.stream.backendList, ', ')}">10.0.0.5:5432</th:block>
                </td>
                <td th:text="${row.stream.note}"></td>
                <td>
                    <span th:if="${row.pendingDelete()}" class="badge warn" th:text="#{files.list.badge.pendingDelete}">삭제 대기</span>
                    <span th:if="${row.pending() and !row.pendingDelete()}" class="badge warn" th:text="#{sites.status.pending}">적용 대기</span>
                </td>
            </tr>
            </tbody>
        </table>
    </section>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
