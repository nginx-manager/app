sites.https.intro=Choose whether this site uses HTTPS and where its certificate comes from. You can leave it off now and issue a Let's Encrypt certificate later from the site page or the Certificates page.
sites.https.mode.NONE=Off (HTTP only)
sites.https.mode.NONE.hint=Serves plain HTTP only. Pick this when the domain does not point to this server yet, or for a test site.
sites.https.mode.LETS_ENCRYPT=Get a Let's Encrypt certificate (free, auto-renewed)
sites.https.mode.LETS_ENCRYPT.hint=After you apply, the certificate is requested, the HTTPS settings are added automatically, and it is renewed before it expires. Every domain of the site must point to this server and be reachable from the internet on port 80. Until the certificate arrives, the site answers over HTTP only. Wildcard domains (*.example.com) are not supported.
sites.https.mode.UPLOADED=Use an uploaded certificate
sites.https.mode.UPLOADED.hint=Uses a certificate you obtained yourself and uploaded on the Certificates page, such as a wildcard or internal CA certificate. It is not renewed automatically.
sites.https.mode.UPLOADED.none=No certificates have been uploaded yet.
sites.https.mode.UPLOADED.link=Upload one on the Certificates page
sites.https.chooseCertificate=Choose a certificate
msg.validation.certificateRequired=Choose the uploaded certificate to use.
sites.detail.https.enableNoteNotLive=This site is not live in nginx yet (not applied, or disabled). If you click now, issuing starts when the site is applied (enable it first if it is disabled).
sites.detail.https.uploadedHint=To use an uploaded certificate instead, choose "Use an uploaded certificate" under HTTPS in the settings and save.
sites.detail.https.waitApply=Issuing starts when this site is applied (enable it first if it is disabled).
sites.detail.https.issueNow=Issue now
sites.detail.https.issueNote=The domains must point to this server and be reachable from the internet on port 80. If it fails, the reason appears here and it is retried automatically later.
msg.cert.issueAfterApply=HTTPS (Let's Encrypt) is on. The certificate will be requested when you apply this site.
certs.list.issue.title=Issue a Let's Encrypt certificate
certs.list.issue.intro=Issues a free certificate for a site created without HTTPS and turns HTTPS on. Once issued, HTTPS is applied to the site automatically and the certificate is renewed before it expires. Sites not applied yet are issued when applied.
certs.list.issue.empty=No site needs one: every form-managed site already uses HTTPS.
certs.list.issue.site=Site
certs.list.issue.siteHint=The site's primary and extra domains all go into one certificate. They must point to this server and be reachable from the internet on port 80.
certs.list.issue.submit=Issue

