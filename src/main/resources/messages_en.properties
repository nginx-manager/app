dashboard.modules.unknown=No description for this module yet. Look it up by name in the nginx documentation.
module.desc.compat=Keeps the binary compatible so dynamic modules built elsewhere can be loaded into this nginx.
module.desc.file-aio=Reads files from disk with asynchronous I/O. Turn it on with the aio directive when serving large files.
module.desc.threads=Enables thread pools, so slow disk reads run on separate threads and don't block request handling (aio threads).
module.desc.pcre-jit=Compiles regular expressions in location and rewrite with JIT so they match faster.
module.desc.debug=Allows detailed debug logging. It takes effect when error_log is set to the debug level.
module.desc.http_addition_module=Adds the output of another request before or after a response body (add_before_body, add_after_body).
module.desc.http_auth_request_module=Checks each request against a separate auth service and lets it through only when allowed (auth_request).
module.desc.http_dav_module=Lets clients upload and manage files with WebDAV PUT, DELETE, MKCOL, COPY and MOVE (dav_methods).
module.desc.http_degradation_module=Returns errors for some requests when memory runs low, so the server keeps running.
module.desc.http_flv_module=Serves FLV video so playback can start from any position (flv).
module.desc.http_gunzip_module=Decompresses gzip responses for clients that don't support gzip (gunzip).
module.desc.http_gzip_static_module=Serves a pre-compressed .gz file when one exists (gzip_static).
module.desc.http_mp4_module=Serves MP4 video so playback can start from any position (mp4).
module.desc.http_random_index_module=Answers a directory request with a randomly chosen file from it (random_index).
module.desc.http_realip_module=Takes the real client IP from headers like X-Forwarded-For when nginx sits behind a proxy or load balancer (set_real_ip_from).
module.desc.http_secure_link_module=Allows access only through links carrying a signature and an expiry time (secure_link).
module.desc.http_slice_module=Fetches and caches large files in slices, useful for proxy-caching big files (slice).
module.desc.http_ssl_module=Provides HTTPS. Sites with a certificate depend on this module (listen ... ssl).
module.desc.http_stub_status_module=Shows basic status such as active connections and handled requests (stub_status).
module.desc.http_sub_module=Replaces strings in the response body before sending it (sub_filter).
module.desc.http_v2_module=Supports HTTP/2, which carries many requests over one connection at once (http2 on).
module.desc.http_v3_module=Supports HTTP/3 over QUIC (listen ... quic).
module.desc.google_perftools_module=Profiles worker CPU usage with Google perftools (google_perftools_profiles).
module.desc.mail=Enables the IMAP, POP3 and SMTP mail proxy (mail block).
module.desc.mail_ssl_module=Adds SSL/TLS and STARTTLS to the mail proxy.
module.desc.stream=Stream proxy that passes TCP and UDP connections through as they are, for non-HTTP services such as databases or mail servers. Create them on the Streams page (stream block).
module.desc.stream_realip_module=Uses the real client address received via the PROXY protocol in the stream proxy (set_real_ip_from).
module.desc.stream_ssl_module=Terminates TLS or connects to backends over TLS in the stream proxy.
module.desc.stream_ssl_preread_module=Reads the requested domain (SNI) without terminating TLS, so connections can be routed by it (ssl_preread).
module.desc.http_xslt_module=Transforms XML responses with XSLT stylesheets (xslt_stylesheet).
module.desc.http_image_filter_module=Resizes, crops or rotates JPEG, GIF, PNG and WebP images on the fly (image_filter).
module.desc.http_geoip_module=Looks up the client IP's country and city in a GeoIP database and exposes them as variables (geoip_country).
module.desc.stream_geoip_module=Looks up the client's country and city with GeoIP in the stream proxy (geoip_country).
module.desc.http_perl_module=Runs handlers and variables written in Perl from the configuration (perl, perl_set).
module.desc.njs=Lets you write request handling and variables in JavaScript, for both HTTP and streams (js_import, js_content).
sites.field.type.REDIRECT=Redirect
sites.list.type.REDIRECT=Redirect
sites.redirect.target=Redirect URL
sites.redirect.target.hint=The address requests are sent to, for example https://new.example.com. Generated with the nginx return directive.
sites.redirect.code=Status code
sites.redirect.code.301=301 Moved permanently (search engines switch to the new address)
sites.redirect.code.302=302 Found (temporary)
sites.redirect.code.307=307 Temporary redirect (keeps POST and other methods)
sites.redirect.code.308=308 Permanent redirect (keeps POST and other methods)
sites.redirect.keepPath=Keep the request path and query string
sites.redirect.keepPath.hint=When on, a request for /a?b=1 goes to <address>/a?b=1. When off, every request goes to the one address.
sites.opt.access.title=Access control (IP, basic auth)
sites.opt.access.intro=Protects internal tools and staging sites. The ACME challenge path is never restricted.
sites.opt.allowFrom=Allowed addresses (empty allows everyone)
sites.opt.allowFrom.hint=One IP or CIDR per line, for example 10.0.0.0/8. Once any address is listed, everything else gets 403 (allow, deny all).
sites.opt.denyFrom=Blocked addresses
sites.opt.denyFrom.hint=Requests from these addresses get 403 (deny). Checked before the allowed list.
sites.opt.authUsers=Basic auth users
sites.opt.authUsers.hint=One "name:password" per line adds a user or changes a password. A name on its own keeps the saved password. Removing a line removes that user. Passwords need at least 8 characters and are stored only as hashes (auth_basic).
sites.opt.satisfyAny=Let in an allowed address or a correct password
sites.opt.satisfyAny.hint=Only matters when both IP rules and passwords are set. When on, the office network gets in without a password and everyone else needs one. When off, both must pass (satisfy).
sites.opt.limit.title=Request rate and connection limits
sites.opt.limit.intro=Keeps a single client from flooding the server. Requests over the limit get 429 (Too Many Requests). Leave empty for no limit.
sites.opt.rateLimit=Requests per second per client IP
sites.opt.rateLimit.hint=For example 10. One page load sends several requests for images and scripts, so be generous and set a burst too (limit_req).
sites.opt.rateBurst=Burst (extra requests accepted at once)
sites.opt.rateBurst.hint=For example 20. This many requests arriving together are served right away; after that the per-second rate applies (limit_req burst).
sites.opt.connLimit=Concurrent connections per client IP
sites.opt.connLimit.hint=For example 20. Limits things like many large downloads at the same time (limit_conn).
sites.opt.perf.title=Performance and security (compression, headers, HTTP/3, request size, real IP, cache)
sites.opt.gzip=Compress responses (gzip)
sites.opt.gzip.hint=Compresses text responses such as HTML, CSS, JavaScript and JSON to send less data. Static sites send a prebuilt .gz file when there is one (gzip, gzip_static).
sites.opt.securityHeaders=Add security headers
sites.opt.securityHeaders.hint=Adds X-Content-Type-Options: nosniff, X-Frame-Options: SAMEORIGIN and Referrer-Policy against common browser attacks. If the backend already sends them they may appear twice (add_header).
sites.opt.hsts=HSTS (browsers always use HTTPS)
sites.opt.hsts.hint=HTTPS sites only. Browsers open this domain only over HTTPS for a year, which makes turning HTTPS off hard. Turn it on once HTTPS works reliably (Strict-Transport-Security).
sites.opt.http3=HTTP/3 (QUIC)
sites.opt.http3.hint=HTTPS sites only. Serves HTTP/3 on UDP port 443 for faster connections on unreliable networks such as mobile. Port 443/udp must be open on the nginx container (listen 443 quic, Alt-Svc).
sites.opt.http3.notReady=The current nginx.conf has no 443 default_server block for HTTP/3 (listen 443 quic reuseport). Add that block to nginx.conf before turning this on (see the README).
sites.opt.maxBodySize=Maximum request size (MB, empty means 1)
sites.opt.maxBodySize.hint=Raise it for large requests such as file uploads. Larger requests get a 413 error. 0 means no limit (client_max_body_size).
sites.opt.realIpFrom=Trusted proxy addresses (real client IP)
sites.opt.realIpFrom.hint=If a load balancer or CDN sits in front of this nginx, list its addresses. For requests from them, the IP in the header below counts as the client IP in logs, IP rules and rate limits (set_real_ip_from).
sites.opt.realIpHeader=Header that carries the real IP
sites.opt.cacheMinutes=Proxy cache time (minutes, reverse proxy)
sites.opt.cacheMinutes.hint=Empty means no caching. When set, successful backend responses (200, 301, 302) are kept for this long and served directly. Responses with Cache-Control: no-store or Set-Cookie are not cached. The X-Cache-Status header shows hits (proxy_cache).
sites.opt.autoindex=Directory listing (static files)
sites.opt.autoindex.hint=Folders without index.html show a list of their files. Only turn this on for folders whose files may all be public (autoindex).
msg.validation.maxBodySize=Maximum request size must be 0 to 10240 MB.
msg.validation.rateLimit=Requests per second must be 1 to 100000.
msg.validation.rateBurst=Burst must be 0 to 100000.
msg.validation.connLimit=Concurrent connections must be 1 to 100000.
msg.validation.cacheMinutes=Cache time must be 1 to 525600 minutes.
msg.validation.addresses=Only IP addresses or CIDRs (for example 10.0.0.0/8) are allowed, separated by spaces, commas or new lines, up to 200.
msg.validation.authUsers=User names use letters, digits and . _ @ - up to 64 characters; passwords are 8 to 128 characters. One "name:password" or name per line, up to 100 users.
msg.validation.redirectTarget=The redirect URL must start with http:// or https:// and cannot contain spaces, quotes, $, ; or #.
msg.validation.redirectCode=The status code must be 301, 302, 307 or 308.
msg.validation.redirectKeepPath=The request path cannot be appended to an address with a query (?). Turn off keeping the path or remove the query.
msg.validation.httpsOnlyOption=HSTS and HTTP/3 are only available on sites with HTTPS turned on.
msg.site.authPasswordRequired=New user {0} needs a password. Write it as name:password.
files.list.new=New file
files.list.deleted=Removed the new file that was never applied.
files.new.title=New configuration file
files.new.help=Create a file under the configuration root (/etc/nginx) for modules that have no form, such as njs scripts, mail or stream configuration, Perl modules and XSLT stylesheets. The file stays pending until you apply it on the Apply page (nginx -t, then reload). nginx only reads it if some configuration includes or loads it.
files.new.path=Path (relative to /etc/nginx)
files.new.path.hint=For example stream.d/mqtt.conf or njs/auth.js. Letters, digits, . _ - and / only; files cannot be created in certs/ or htpasswd/.
files.new.content=Content
files.new.submit=Create
files.new.error.path=This path is not allowed. Use only letters, digits, . _ - and /, with no .. or names starting with a dot, and nothing under certs/ or htpasswd/.
files.new.error.exists=That file already exists. Open it from the configuration file list to edit it.
files.new.where.stream=Read by the stream block in nginx.conf. For stream settings the Streams page cannot make, such as routing by SNI.
files.new.where.sites=Read by the http block. A file created here shows up in the site list as a raw config site once applied.
files.new.where.njs=njs scripts. Load them with js_import njs/file.js; in nginx.conf or a site configuration.
files.new.where.main=Top-level configuration such as a mail block is loaded by adding an include line to nginx.conf.
files.edit.delete=Delete file
files.edit.delete.hint=The deletion stays pending. The file is removed from the server when applied; until then you can bring it back by discarding the change on the Apply page. Site files are handled by disabling the site.
files.edit.deleted.before=Deleting this file is pending. Go to the
files.edit.deleted.after= to apply or discard it.
nav.streams=Streams
streams.list.title=Streams (TCP/UDP proxy)
streams.list.add=Add stream
streams.list.help=Puts non-HTTP services such as databases, MQTT or game servers behind nginx. Incoming TCP/UDP connections are passed to the backend as they are, without looking inside (stream module). Each stream becomes one file under stream.d/ and, like sites, is applied on the Apply page (nginx -t, then reload).
streams.list.empty=No streams yet.
streams.list.col.listen=Listen port
streams.list.col.backends=Backends
streams.list.col.note=Note
streams.list.deleted.before=Stream deletion is pending.
streams.badge.raw=Raw config
streams.form.title=Add stream
streams.form.portNote=To reach it from outside, the port must be open on the nginx container. Add "port:port" ("port:port/udp" for UDP) to ports of the nginx service in docker-compose.yml and recreate it (docker compose up -d).
streams.field.protocol=Protocol
streams.field.protocol.hint=Services that keep a connection open, such as databases, MQTT, SSH and Redis, use TCP. DNS, syslog and some game servers use UDP.
streams.field.listenPort=Listen port
streams.field.listenPort.hint=The port nginx accepts connections on. Protocol and port become the file name (stream.d/tcp-5432.conf) and cannot change after saving. 80, 443, 7070, 8081, 9000 and ports used by sites are not available.
streams.field.backends=Backends (host:port, one per line)
streams.field.backends.hint=Servers to pass connections to, for example 10.0.0.5:5432 or db:5432. Host names are looked up once when nginx reads its configuration, so they must resolve then.
streams.field.loadBalancing=Load balancing method
streams.field.loadBalancing.hint=Only used with two or more backends. For services that lose state when a connection moves (games, servers that remember sessions), choose IP hash.
streams.field.connectTimeout=Connect timeout (seconds, empty means 60)
streams.field.connectTimeout.hint=How long to wait for a connection to the backend. After that the next backend is tried (proxy_connect_timeout).
streams.field.idleTimeout=Idle timeout (seconds, empty means 600)
streams.field.idleTimeout.hint=The connection is closed when neither side sends anything for this long. Raise it for long-lived database or MQTT connections (proxy_timeout).
streams.field.note=Note
streams.field.note.hint=What this stream is for. Also written as a comment at the top of the file.
streams.detail.fixedPort=Protocol and port cannot change. Delete this stream and create a new one instead.
streams.detail.raw.body=This stream file was changed in the file editor or created by hand, so it is managed as raw configuration only. The form will not overwrite it.
streams.detail.ports=To reach it from outside, add "{0}:{0}{1}" to ports of the nginx service in docker-compose.yml.
streams.detail.delete=Delete stream
enum.StreamBalancing.ROUND_ROBIN=Round robin (default)
enum.StreamBalancing.LEAST_CONN=Least connections (least_conn)
enum.StreamBalancing.IP_HASH=IP hash (ip_hash)
msg.validation.streamPort=The port must be 1 to 65535.
msg.validation.streamIdleTimeout=The idle timeout must be 1 to 86400 seconds.
msg.validation.streamBackends=Enter 1 to 32 backends as host:port, for example 10.0.0.5:5432.
msg.validation.streamReservedPort=This port is used by HTTP (80, 443) or the manager (7070, 8081, 9000). For UDP only 443 (HTTP/3) is unavailable.
msg.stream.portTaken=Port {0} is already used by {1}.

