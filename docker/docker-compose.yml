# 개발·시험용 compose. 서버에는 릴리스의 설치 묶음(install.sh, deploy/)을 쓴다.
# 실행 예시. docker compose -f docker/docker-compose.yml up -d
#
# nginx와 관리 화면이 컨테이너 두 개로 돈다. 관리 화면을 업데이트하거나 다시 띄워도 nginx는 계속 트래픽을 받는다.
# - NGINX_MANAGER_VERSION 하나로 두 이미지를 함께 정한다(예: 1.0.0). 따로 정하려면 MANAGER_VERSION, NGINX_IMAGE.
# - 관리 화면은 nginx 컨테이너 안의 에이전트(7070)에 nginx -t·reload를 요청한다. 에이전트는 호스트에 열지 않는다.
# - 에이전트 토큰은 nginx 컨테이너가 처음 뜰 때 nm-shared 볼륨에 만들고 관리 화면이 읽는다. 따로 정할 것은 없다.
services:
  nginx:
    image: ghcr.io/nginx-manager/nginx:${NGINX_IMAGE:-${NGINX_MANAGER_VERSION:-latest}}
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"   # HTTP/3(QUIC)
      # 스트림(TCP/UDP) 프록시를 만들면 그 포트도 여기에 더한다. 예: - "5432:5432", - "1883:1883"
    volumes:
      - nm-conf:/etc/nginx                # nginx 설정, 인증서(certs/)
      - nm-logs:/var/log/nginx            # 접근·오류 로그
      - nm-shared:/var/lib/nginx-manager  # ACME 챌린지 파일, 에이전트 토큰
    environment:
      TZ: Asia/Seoul
    # nginx가 연결을 정리할 시간을 준다
    stop_grace_period: 40s

  manager:
    image: ghcr.io/nginx-manager/app:${MANAGER_VERSION:-${NGINX_MANAGER_VERSION:-latest}}
    restart: unless-stopped
    depends_on:
      nginx:
        condition: service_healthy
    ports:
      # 관리 화면. 사내망에서만 쓰거나 127.0.0.1:9000:9000 처럼 묶어 두고 HTTPS 프록시 뒤에 둔다
      - "9000:9000"
    volumes:
      # nginx와 같은 볼륨을 같은 경로에 둔다
      - nm-conf:/etc/nginx
      - nm-logs:/var/log/nginx
      - nm-shared:/var/lib/nginx-manager
      - nm-data:/data                     # 관리도구 DB, ACME 계정 키
      # 호스트의 nginx 설정 파일을 사이트로 가져올 때(설정 파일 가져오기): 같은 경로에 읽기 전용으로 마운트하고
      # 아래 NGINX_MANAGER_IMPORT_ROOTS에 적는다. 관리도구는 UID 10101로 돌므로 파일을 읽을 수 있어야 한다
      # - /home:/home:ro
    environment:
      NGINX_RUNTIME_AGENT_URL: http://nginx:7070
      # 설정 파일 가져오기에서 /etc/nginx 말고 찾을 수 있는 디렉터리(쉼표로 여럿)
      # NGINX_MANAGER_IMPORT_ROOTS: /home
      # 메일 알림을 쓸 때
      # SPRING_MAIL_HOST: smtp.example.com
      # SPRING_MAIL_PORT: "587"
      # SPRING_MAIL_USERNAME: nginx-manager@example.com
      # SPRING_MAIL_PASSWORD: change-me
      # 관리 화면을 HTTPS 프록시 뒤에 둘 때
      # SERVER_SERVLET_SESSION_COOKIE_SECURE: "true"
      TZ: Asia/Seoul
    # 진행 중인 적용(검증·reload·상태 확인·복구)이 끝날 시간을 준다
    stop_grace_period: 40s

volumes:
  nm-conf:
  nm-logs:
  nm-shared:
  nm-data:
