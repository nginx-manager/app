# nginx-manager 기본 설정. 사이트 설정은 conf.d/sites/ 아래에 사이트마다 파일 하나로 둔다.
# 이 파일도 관리도구의 원문 편집기로 고칠 수 있다.

worker_processes auto;
pid /run/nginx/nginx.pid;
error_log /var/log/nginx/error.log notice;

# 동적 모듈은 모두 불러 둔다(전체 모듈 기준).
load_module /usr/lib/nginx/modules/ngx_http_xslt_filter_module.so;
load_module /usr/lib/nginx/modules/ngx_http_image_filter_module.so;
load_module /usr/lib/nginx/modules/ngx_http_geoip_module.so;
load_module /usr/lib/nginx/modules/ngx_stream_geoip_module.so;
load_module /usr/lib/nginx/modules/ngx_http_perl_module.so;
load_module /usr/lib/nginx/modules/ngx_http_js_module.so;
load_module /usr/lib/nginx/modules/ngx_stream_js_module.so;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /var/log/nginx/access.log main;

    sendfile on;
    keepalive_timeout 65;
    server_tokens off;

    # 관리도구 상태 확인 전용. 컨테이너 밖으로 노출하지 않는다.
    server {
        listen 127.0.0.1:8081;
        location = /nginx_status {
            stub_status;
        }
    }

    # 등록되지 않은 호스트 요청과 Let's Encrypt HTTP-01 챌린지를 받는다.
    server {
        # IPv6가 꺼진 Docker 환경이 많아 기본은 IPv4만 연다
        listen 80 default_server;
        server_name _;

        location ^~ /.well-known/acme-challenge/ {
            root /var/lib/nginx-manager/acme-webroot;
            default_type text/plain;
        }

        location / {
            return 404;
        }
    }

    include /etc/nginx/conf.d/sites/*.conf;
}

stream {
    include /etc/nginx/stream.d/*.conf;
}
