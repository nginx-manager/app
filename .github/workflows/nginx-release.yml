name: Release images

# 이미지는 둘이다. 이전 태그는 지우지 않으므로 언제든 되돌릴 수 있다.
# - nginx 이미지(ghcr.io/<owner>/nginx): nginx + 에이전트. 태그는 <관리도구 버전>-nginx<nginx 버전>, <관리도구 버전>, latest
# - 관리도구 이미지(ghcr.io/<owner>/app): 관리 화면. 태그는 <관리도구 버전>, latest
# nginx 새 릴리스(보안 패치 포함)가 나오면 nginx 이미지만 다시 빌드·테스트해 게시한다(FR-026). 관리 화면은 그대로 둔다.
# 관리도구를 릴리스(v* 태그)하면 두 이미지를 함께 게시한다.

on:
  schedule:
    - cron: '17 3 * * *'
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      nginx_version:
        description: 'nginx 버전(비우면 최신 릴리스)'
        required: false
      force:
        description: '같은 태그가 이미 있어도 다시 게시'
        type: boolean
        default: false

permissions:
  # 설치 묶음을 GitHub Release에 첨부한다
  contents: write
  packages: write
  issues: write

concurrency:
  group: release-image
  cancel-in-progress: false

env:
  APP_IMAGE: ghcr.io/${{ github.repository_owner }}/app
  NGINX_IMAGE: ghcr.io/${{ github.repository_owner }}/nginx

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          # 예약 실행은 최신 관리도구 릴리스 태그를 기준으로 nginx만 올린다
          fetch-depth: 0

      - name: Pick versions
        id: versions
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_NGINX: ${{ inputs.nginx_version }}
        run: |
          set -euo pipefail
          nginx="${INPUT_NGINX:-}"
          if [ -z "$nginx" ]; then
            # latest는 stable 패치가 나중에 나오면 stable을 가리킨다. 가장 높은 정식 버전(mainline)을 고른다
            nginx="$(gh api 'repos/nginx/nginx/releases?per_page=30' --jq '.[] | select(.prerelease | not) | .tag_name' \
              | sed 's/^release-//' | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n1)"
          fi
          if ! echo "$nginx" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "unexpected nginx version: $nginx" >&2
            exit 1
          fi
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            ref="${GITHUB_REF_NAME}"
          else
            # v1.2.0-rc1 같은 시험 태그는 건너뛴다
            ref="$(git tag --list 'v*' | grep -Ev -- '-' | sort -V | tail -n1 || true)"
          fi
          if [ -z "$ref" ]; then
            echo "no app release tag (v*) yet; nothing to publish" >&2
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          app="${ref#v}"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "nginx=$nginx" >> "$GITHUB_OUTPUT"
          echo "app=$app" >> "$GITHUB_OUTPUT"
          echo "tag=${app}-nginx${nginx}" >> "$GITHUB_OUTPUT"

      - name: Skip when already published
        id: existing
        if: steps.versions.outputs.skip != 'true'
        run: |
          # 릴리스 태그를 밀었거나 force로 돌리면 다시 게시하고, 그 밖에는 이미 있는 nginx 태그를 건너뛴다
          if [ "${{ github.event_name }}" != "push" ] && [ "${{ inputs.force }}" != "true" ]; then
            if docker manifest inspect "$NGINX_IMAGE:${{ steps.versions.outputs.tag }}" > /dev/null 2>&1; then
              echo "$NGINX_IMAGE:${{ steps.versions.outputs.tag }} already exists"
              echo "skip=true" >> "$GITHUB_OUTPUT"
            fi
          fi
          # 관리도구 이미지는 릴리스할 때(또는 아직 없을 때)만 게시한다. nginx만 바뀐 예약 실행은 그대로 둔다
          if [ "${{ github.event_name }}" = "push" ] || [ "${{ inputs.force }}" = "true" ] \
              || ! docker manifest inspect "$APP_IMAGE:${{ steps.versions.outputs.app }}" > /dev/null 2>&1; then
            echo "publish_app=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out release
        if: steps.versions.outputs.skip != 'true' && steps.existing.outputs.skip != 'true'
        run: git checkout --quiet "${{ steps.versions.outputs.ref }}"

      - uses: actions/setup-java@v4
        if: steps.versions.outputs.skip != 'true' && steps.existing.outputs.skip != 'true'
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build images
        if: steps.versions.outputs.skip != 'true' && steps.existing.outputs.skip != 'true'
        run: |
          docker build -f docker/nginx/Dockerfile \
            --build-arg NGINX_VERSION="${{ steps.versions.outputs.nginx }}" \
            --build-arg APP_VERSION="${{ steps.versions.outputs.app }}" \
            -t "$NGINX_IMAGE:${{ steps.versions.outputs.tag }}" .
          # 관리도구는 게시하지 않을 때도 테스트하려고 같은 릴리스로 빌드한다(같은 소스라 결과가 같다)
          docker build -f docker/manager/Dockerfile --build-arg APP_VERSION="${{ steps.versions.outputs.app }}" -t "$APP_IMAGE:${{ steps.versions.outputs.app }}" .

      - name: Test images
        if: steps.versions.outputs.skip != 'true' && steps.existing.outputs.skip != 'true'
        run: |
          mvn -B -Pimage-test test \
            -Dimage.name="$APP_IMAGE:${{ steps.versions.outputs.app }}" \
            -Dnginx.image.name="$NGINX_IMAGE:${{ steps.versions.outputs.tag }}"

      - name: Publish
        if: steps.versions.outputs.skip != 'true' && steps.existing.outputs.skip != 'true'
        run: |
          echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          tag="${{ steps.versions.outputs.tag }}"
          app="${{ steps.versions.outputs.app }}"
          docker tag "$NGINX_IMAGE:$tag" "$NGINX_IMAGE:$app"
          docker tag "$NGINX_IMAGE:$tag" "$NGINX_IMAGE:latest"
          docker push "$NGINX_IMAGE:$tag"
          docker push "$NGINX_IMAGE:$app"
          docker push "$NGINX_IMAGE:latest"
          if [ "${{ steps.existing.outputs.publish_app }}" = "true" ]; then
            docker tag "$APP_IMAGE:$app" "$APP_IMAGE:latest"
            docker push "$APP_IMAGE:$app"
            docker push "$APP_IMAGE:latest"
          fi

      # 설치 묶음(compose.yml, .env.example, nm)과 install.sh를 그 릴리스에 첨부한다(008).
      # nginx만 다시 빌드한 날에도 묶음의 권장 nginx 이미지를 새 태그로 바꿔 올린다(`nm upgrade`가 알린다)
      - name: Attach install bundle
        if: steps.versions.outputs.skip != 'true' && steps.existing.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          app="${{ steps.versions.outputs.app }}"
          deploy/build-bundle.sh "$app" "${{ steps.versions.outputs.tag }}" bundle-out
          if ! gh release view "v$app" > /dev/null 2>&1; then
            notes="docs/releases/v$app.md"
            [ -f "$notes" ] || notes=/dev/null
            gh release create "v$app" --verify-tag --title "v$app" --notes-file "$notes"
          fi
          gh release upload "v$app" bundle-out/nginx-manager.tar.gz bundle-out/install.sh --clobber

      - name: Open an issue when the build fails
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="이미지 릴리스 실패: ${{ steps.versions.outputs.tag || github.ref_name }}"
          if gh issue list --state open --search "\"$title\" in:title" --json number --jq '.[0].number' | grep -q .; then
            echo "issue already open"
            exit 0
          fi
          gh issue create --title "$title" --body "nginx ${{ steps.versions.outputs.nginx }} 이미지 빌드·테스트가 실패해 게시하지 않았습니다. 기존 태그는 그대로입니다.

          실행 기록: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
